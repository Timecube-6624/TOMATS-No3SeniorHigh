<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>触屏+翻页笔兼容性测试（20页）</title>
    <style>
        /* ====== 极简高对比度样式，兼容老旧浏览器 ====== */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* 幻灯片容器 */
        #slide-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none; 
        }
        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 8vw;
            margin: 0 0 20px 0;
            text-align: center;
        }
        p {
            font-size: 4vw;
            color: #aaa;
            text-align: center;
        }

        /* ====== 触控热区（符合你的要求：上30%上一页，下70%下一页） ====== */
        .touch-zone {
            position: fixed;
            left: 0;
            width: 100%;
            z-index: 100; /* 确保在幻灯片之上，能捕获点击 */
            cursor: pointer;
        }
        
        /* 顶部 30% 区域：上一页 */
        #zone-top {
            top: 0;
            height: 30%;
            /* 加一个极淡的渐变提示，方便你测试时看清边界，不需要可删掉下面这行 */
            background: linear-gradient(to bottom, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        }
        
        /* 底部 70% 区域：下一页 */
        #zone-bottom {
            top: 30%;
            height: 70%;
        }

        /* ====== 底部状态调试栏 ====== */
        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #111;
            border-top: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            font-size: 18px;
            z-index: 9999; /* 保证永远在最上层，不被触摸区挡住 */
        }
        .status-item {
            color: #4CAF50; /* 绿色高亮 */
            font-weight: bold;
        }
        .status-warning {
            color: #FFC107; /* 黄色 */
        }
    </style>
</head>
<body>

    <!-- 幻灯片容器（由JS动态生成20页） -->
    <div id="slide-container"></div>

    <!-- 触控热区 -->
    <div class="touch-zone" id="zone-top"></div>
    <div class="touch-zone" id="zone-bottom"></div>

    <!-- 底部调试状态栏 -->
    <div id="status-bar">
        <span>当前页码：<span class="status-item" id="pageIndicator">1 / 20</span></span>
        <span>最近操作：<span class="status-item status-warning" id="lastAction">等待操作...</span></span>
    </div>

    <script>
        // 使用原生 ES5 语法，确保老旧一体机浏览器兼容
        (function() {
            var totalSlides = 20; // 设定总页数 15~30 均可
            var currentSlide = 1;
            var isTransitioning = false; // 防抖锁

            var container = document.getElementById('slide-container');
            var pageIndicator = document.getElementById('pageIndicator');
            var lastAction = document.getElementById('lastAction');

            // 1. 动态生成 20 页内容
            var slides = [];
            for (var i = 1; i <= totalSlides; i++) {
                var slide = document.createElement('div');
                slide.className = 'slide' + (i === 1 ? ' active' : '');
                slide.innerHTML = '<h1>第 ' + i + ' 页</h1><p>点击屏幕上方 30% 返回上一页 | 点击下方 70% 进入下一页</p>';
                container.appendChild(slide);
                slides.push(slide);
            }

            // 2. 更新页面显示
            function updateSlide() {
                for (var i = 0; i < slides.length; i++) {
                    if (i === currentSlide - 1) {
                        slides[i].className = 'slide active';
                    } else {
                        slides[i].className = 'slide';
                    }
                }
                pageIndicator.innerText = currentSlide + ' / ' + totalSlides;
            }

            // 3. 记录操作日志
            function logAction(actionText) {
                lastAction.innerText = actionText;
            }

            // 4. 下一页
            function nextSlide() {
                if (isTransitioning) return;
                if (currentSlide < totalSlides) {
                    isTransitioning = true;
                    currentSlide++;
                    updateSlide();
                    setTimeout(function() { isTransitioning = false; }, 400);
                }
            }

            // 5. 上一页
            function prevSlide() {
                if (isTransitioning) return;
                if (currentSlide > 1) {
                    isTransitioning = true;
                    currentSlide--;
                    updateSlide();
                    setTimeout(function() { isTransitioning = false; }, 400);
                }
            }

            // 6. 键盘事件监听（翻页笔）
            document.addEventListener('keydown', function(event) {
                var key = event.key;
                var keyCode = event.keyCode;

                // 下一页：PageDown, ArrowRight, Space
                if (key === 'PageDown' || key === 'ArrowRight' || key === ' ' || keyCode === 34 || keyCode === 39 || keyCode === 32) {
                    logAction('翻页笔/键盘：下一页');
                    nextSlide();
                    event.preventDefault();
                }
                // 上一页：PageUp, ArrowLeft
                else if (key === 'PageUp' || key === 'ArrowLeft' || keyCode === 33 || keyCode === 37) {
                    logAction('翻页笔/键盘：上一页');
                    prevSlide();
                    event.preventDefault();
                }
            });

            // 7. 触屏/鼠标点击热区
            // 点击上方 30% -> 上一页
            document.getElementById('zone-top').addEventListener('click', function() {
                logAction('触屏：点击上方30%（上一页）');
                prevSlide();
            });

            // 点击下方 70% -> 下一页
            document.getElementById('zone-bottom').addEventListener('click', function() {
                logAction('触屏：点击下方70%（下一页）');
                nextSlide();
            });

            // 8. 防止触摸时页面跟着滚动
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

        })();
    </script>
</body>
</html>
