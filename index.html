                }
            };

            /* 逐字遮罩块，但用 .sw（由滚动触发），并且：
               · 不把 <strong> 之类的标签拆开
               · 标点粘在前一个字块里 —— 每个字都是 inline-block，浏览器不会做行首禁则，
                 不然「，」「。」可能跑到行首 */
            var SW_PUNCT = '，。、；：！？）》”’…·％';

            function riseSwHtml(html, t0, step) {
                var parts = [], buf = '', k = 0,
                    i = 0, n = html.length, ch, end;

                function flush() {
                    if (!buf) { return; }
                    var d = (t0 + k * step).toFixed(3) + 's';
                    parts.push('<span class="sw"><i style="-webkit-animation-delay:' + d +
                               ';animation-delay:' + d + '">' + buf + '</i></span>');
                    k++;
                    buf = '';
                }

                while (i < n) {
                    ch = html.charAt(i);
                    if (ch === '<') {
                        end = html.indexOf('>', i);
                        if (end < 0) { flush(); parts.push(html.substring(i)); break; }
                        flush();
                        parts.push(html.substring(i, end + 1));   /* 标签原样输出 */
                        i = end + 1;
                        continue;
                    }
                    if (SW_PUNCT.indexOf(ch) >= 0 && buf) { buf += ch; i++; continue; }
                    flush();
                    buf = (ch === ' ' ? '&nbsp;' : ch);
                    i++;
                }
                flush();
                return parts.join('');
            }

            function buildScrollScene(page, cfg) {
                var stops = '', subs = '', i, st, cur = null, lastSub = cfg.sub || '';

                /* 先算出每一屏生效的小标题（不写就沿用上一屏），变化处生成一条蓝字 */
                for (i = 0; i < cfg.stops.length; i++) {
                    st = cfg.stops[i];
                    cur = (typeof st === 'string' || !st.sub) ? lastSub : st.sub;
                    if (cur !== lastSub || i === 0) {
                        if (i === 0 && !cur) { cur = ''; }
                        subs += '<span class="pin-sub-line' + (i === 0 ? ' on' : '') + '" data-from="' + i + '">' +
                                    (cur ? riseSwHtml(cur, 0.15, 0.02) : '') +
                                '</span>';
                        lastSub = cur;
                    }
                }

                /* 顶部固定不动的标题区（蓝字小标题按滚动切换） */
                var head = '<div class="pin-head">' +
                               '<div class="pin-label">' + riseChars(cfg.label, 0.10, 0.022) + '</div>' +
                               '<h2 class="pin-title">' + riseChars(cfg.title, 0.22, 0.045) + '</h2>' +
                               '<div class="pin-rule"></div>' +
                               '<div class="pin-sub">' + subs + '</div>' +
                           '</div>';

                /* 下面每一屏就是一段正文（小标题已经在上面固定区里了） */
                for (i = 0; i < cfg.stops.length; i++) {
                    st = cfg.stops[i];
                    stops += '<section class="sp-stop">' +
                                 '<p class="sp-text">' +
                                     riseSwHtml(typeof st === 'string' ? st : st.text, 0.2, 0.012) +
                                 '</p>' +
                             '</section>';
                }

                return buildSeaScene(
                    head +
                    '<div class="scroll-page under-head" id="sp' + page + '">' +
                        '<div class="sp-inner">' + stops + '</div>' +
                    '</div>' +
                    '<div class="sp-progress"><i></i></div>'
                );
            }

            /* 按当前滚到的屏，切换蓝色小标题 */
            function updatePinSub(el, idx) {
                if (!el || !el.parentNode) { return; }
                var lines = el.parentNode.querySelectorAll('.pin-sub-line'), i,
                    from, best = null, bestFrom = -1;
                for (i = 0; i < lines.length; i++) {
                    from = parseInt(lines[i].getAttribute('data-from'), 10);
                    if (isNaN(from)) { from = 0; }
                    if (from <= idx && from > bestFrom) { bestFrom = from; best = lines[i]; }
                }
                for (i = 0; i < lines.length; i++) {
                    if (lines[i] === best) {
                        if ((' ' + lines[i].className + ' ').indexOf(' on ') < 0) {
                            lines[i].className = 'pin-sub-line on';   /* 重新加上会重播逐字动画 */
                        }
                    } else if ((' ' + lines[i].className + ' ').indexOf(' on ') >= 0) {
                        lines[i].className = 'pin-sub-line';
                    }
                }
            }

            /* ---- 滚动长页的控制 ---- */
            function spElOf(page) {
                return document.getElementById('sp' + page);
            }

            function spStops(el) {
                return el ? el.querySelectorAll('.sp-stop') : [];
            }

            /* 把某一屏标成已出现（顺便按滚动位置更新“当前第几屏”和进度条） */
            function revealStops(el) {
                if (!el) { return; }
                var stops = spStops(el), i, st, idx = 0, maxTop = 0;
                for (i = 0; i < stops.length; i++) {
                    st = stops[i];
                    if (st.offsetTop <= el.scrollTop + el.clientHeight * 0.72) {
                        if ((' ' + st.className + ' ').indexOf(' is-in ') < 0) {
                            st.className = st.className + ' is-in';
                        }
                    }
                    if (el.scrollTop + el.clientHeight * 0.5 >= st.offsetTop) { idx = i; }
                }
                el.__stopIdx = idx;
                updatePinSub(el, idx);          /* 蓝色小标题跟着切 */
                /* 右侧进度条 */
                var box = el.parentNode ? el.parentNode.querySelector('.sp-progress i') : null;
                if (box) {
                    maxTop = el.scrollHeight - el.clientHeight;
                    box.style.height = (maxTop > 0 ? Math.min(100, 100 * el.scrollTop / maxTop) : 100) + '%';
                }
            }

            function smoothScrollTo(el, target, done) {
                if (!el) { if (done) { done(); } return; }
                if (el.__timer) { clearInterval(el.__timer); el.__timer = null; }
                var from = el.scrollTop, dist = target - from,
                    t0 = (new Date()).getTime(), dur = 700;
                if (Math.abs(dist) < 2) { if (done) { done(); } return; }
                el.__timer = setInterval(function () {
                    var k = ((new Date()).getTime() - t0) / dur;
                    if (k > 1) { k = 1; }
                    el.scrollTop = from + dist * (1 - Math.pow(1 - k, 3));   /* easeOutCubic */
                    revealStops(el);
                    if (k >= 1) {
                        clearInterval(el.__timer);
                        el.__timer = null;
                        revealStops(el);
                        if (done) { done(); }
                    }
                }, 16);
            }

            /* 页内往下滚一屏；没有下一屏就返回 false（交给普通翻页） */
            function scrollNextStop(page) {
                var el = spElOf(page), stops = spStops(el);
                if (!el || !stops.length) { return false; }
                var idx = el.__stopIdx || 0;
                if (idx >= stops.length - 1) { return false; }
                isTransitioning = true;
                smoothScrollTo(el, stops[idx + 1].offsetTop, function () { isTransitioning = false; });
                return true;
            }

            /* 页内往上滚一屏；已经在第一屏就返回 false（交给普通翻页） */
            function scrollPrevStop(page) {
                var el = spElOf(page), stops = spStops(el);
                if (!el || !stops.length) { return false; }
                var idx = el.__stopIdx || 0;
                if (idx <= 0) { return false; }
                isTransitioning = true;
                smoothScrollTo(el, stops[idx - 1].offsetTop, function () { isTransitioning = false; });
                return true;
            }

            /* 进入滚动页时回到第一屏，并清掉上一次的 is-in（这样重进会重新播） */
            function resetScrollPage(page) {
                var el = spElOf(page), stops = spStops(el), i;
                if (!el) { return; }
                for (i = 0; i < stops.length; i++) { stops[i].className = 'sp-stop'; }
                el.scrollTop = 0;
                el.__stopIdx = 0;
                revealStops(el);
            }

            function buildSectionScene(cfg) {
                var lines = '', i, t;
                /* 正文：每句一个块，句内逐字升起；三句再整体错开 */
                for (i = 0; i < cfg.body.length; i++) {
                    t = 0.95 + i * 0.30;
                    lines += '<span class="ln">' + riseChars(cfg.body[i], t, 0.014) + '</span>';
                }
                /* 小标签、大标题、副标题：全部逐字 */
                return buildSeaScene(
                    '<div class="sec">' +
                        '<div class="sec-label">' + riseChars(cfg.label, 0.10, 0.022) + '</div>' +
                        '<h2 class="sec-title">' + riseChars(cfg.title, 0.22, 0.045) + '</h2>' +
                        '<div class="sec-rule"></div>' +
                        '<div class="sec-sub">' + riseChars(cfg.sub, 0.62, 0.028) + '</div>' +
                        '<p class="sec-body">' + lines + '</p>' +
                    '</div>'
                );
            }

            /* ============================================================
               最后一页的画面
               ------------------------------------------------------------
               课文节选停在老人“脸朝下趴在报纸上”的那一句。这一页不再出现
               任何文字，只把这场搏斗的终点摆在黑暗中：一副被鲨鱼啃净的、
               巨大的白色鱼骨架，和一点几乎看不见的晨光。
               整幅骨架由代码生成（非图片素材），投影到任何尺寸都锐利。
               ============================================================ */
            var BONE = '#fbfaf7',
                NV   = 32,      /* 脊椎节数 */
                X0   = 610,     /* 脊椎起点 x */
                X1   = 1335;    /* 脊椎终点 x */

            function fx(n)     { return Math.round(n * 10) / 10; }
            function spX(t)    { return X0 + (X1 - X0) * t; }
            function spY(t)    { return 344 - 14 * Math.sin(Math.PI * t); }
            function sclv(t)   { return 1 - 0.58 * t; }
            function dorsY(t)  { return spY(t) - 8 * sclv(t); }
            function ventY(t)  { return spY(t) + 8 * sclv(t); }

            function buildSkeleton() {
                var o = [], i, t, u;

                /* --- 吻：两根收敛的骨线，马林鱼最好认的轮廓 --- */
                o.push('<path d="M 60 366 L 470 340" />');
                o.push('<path d="M 60 370 L 470 372" />');
                for (i = 1; i <= 7; i++) {
                    var bx = 60 + (410 / 8) * i,
                        by1 = 366 + (340 - 366) * (i / 8) - 0.4,
                        by2 = 370 + (372 - 370) * (i / 8) + 0.4;
                    o.push('<path d="M ' + fx(bx) + ' ' + fx(by1) + ' L ' + fx(bx) + ' ' + fx(by2) + '" opacity="0.45" />');
                }

                /* --- 头骨与眼眶 --- */
                o.push('<path d="M 470 340 L 520 322 C 570 306 606 318 624 348 L 630 372 ' +
                       'C 612 398 574 408 536 402 L 486 396 C 468 386 464 358 470 340 Z" />');
                o.push('<circle cx="546" cy="352" r="25" fill="none" />');
                o.push('<circle cx="546" cy="352" r="5" fill="#fbfaf7" stroke="none" opacity="0.85" />');

                /* --- 下颌：口微张，向前收成一点 --- */
                o.push('<path d="M 616 396 C 540 412 420 424 344 428" />');
                o.push('<path d="M 624 414 C 548 430 428 438 348 430" />');

                /* --- 鳃弓与鳃盖 --- */
                for (i = 0; i < 4; i++) {
                    o.push('<path d="M ' + fx(600 - i * 3) + ' ' + fx(334 + i * 9) +
                           ' Q ' + fx(706 + i * 7) + ' 388 ' + fx(614 - i * 2) + ' ' + fx(452 + i * 7) + '" />');
                }
                o.push('<path d="M 628 330 C 712 352 724 424 640 454" />');

                /* --- 脊椎：连续锥体带 + 椎节分隔 --- */
                var top = [], bot = [], SAMP = 64;
                for (i = 0; i <= SAMP; i++) {
                    t = i / SAMP;
                    top.push(fx(spX(t)) + ' ' + fx(dorsY(t)));
                    bot.push(fx(spX(t)) + ' ' + fx(ventY(t)));
                }
                o.push('<path d="M ' + top.join(' L ') + ' L ' + bot.reverse().join(' L ') + ' Z" />');
                for (i = 0; i < NV; i++) {
                    t = i / (NV - 1);
                    o.push('<path d="M ' + fx(spX(t)) + ' ' + fx(dorsY(t)) +
                           ' L ' + fx(spX(t)) + ' ' + fx(ventY(t)) + '" opacity="0.30" />');
                }

                /* --- 神经棘（背）与脉棘（腹）：脊椎两侧的“梳齿” --- */
                for (i = 0; i < NV; i++) {
                    t = i / (NV - 1);
                    var s = sclv(t),
                        ln = 40 * s * (0.62 + 0.55 * Math.sin(Math.PI * t));
                    o.push('<path d="M ' + fx(spX(t)) + ' ' + fx(dorsY(t)) +
                           ' L ' + fx(spX(t) + ln * 0.24) + ' ' + fx(dorsY(t) - ln) + '" opacity="0.92" />');
                    if (t > 0.46) {
                        var lv = 38 * s * (0.7 + 0.45 * Math.sin(Math.PI * t));
                        o.push('<path d="M ' + fx(spX(t)) + ' ' + fx(ventY(t)) +
                               ' L ' + fx(spX(t) + lv * 0.24) + ' ' + fx(ventY(t) + lv) + '" opacity="0.92" />');
                    }
                }

                /* --- 肋骨：前半身最主要的体块，也是“被啃净”最直接的那一笔 --- */
                var RB0 = 2, RB1 = 17;
                for (i = RB0; i <= RB1; i++) {
                    t = i / (NV - 1);
                    var ur = (i - RB0) / (RB1 - RB0),
                        rl = 152 * (0.38 + 0.62 * Math.sin(Math.PI * Math.pow(ur, 0.8))),
                        dx = 26 + 10 * Math.sin(Math.PI * ur),
                        y0 = ventY(t);
                    o.push('<path d="M ' + fx(spX(t)) + ' ' + fx(y0) +
                           ' Q ' + fx(spX(t) + dx * 0.25) + ' ' + fx(y0 + rl * 0.62) +
                           ' ' + fx(spX(t) + dx) + ' ' + fx(y0 + rl) + '" />');
                }

                /* --- 背鳍：马林鱼的“帆”，前缘最高，顶缘圆滑下垂 --- */
                var DS0 = 0.045, DS1 = 0.44, DN = 20;
                for (i = 0; i <= DN; i++) {
                    t = DS0 + (DS1 - DS0) * (i / DN);
                    u = i / DN;
                    var dl = 190 * Math.pow(1 - Math.pow(u, 1.7), 0.85) + 5,
                        ox = spX(t), oy = dorsY(t);
                    o.push('<path d="M ' + fx(ox) + ' ' + fx(oy) +
                           ' Q ' + fx(ox + dl * 0.14) + ' ' + fx(oy - dl * 0.56) +
                           ' ' + fx(ox + dl * 0.30) + ' ' + fx(oy - dl) +
                           '" stroke-width="' + (i === 0 ? 3.2 : 2.6) +
                           '" opacity="' + fx(i === 0 ? 1 : 0.9) + '" />');
                }

                /* --- 第二背鳍 / 臀鳍 --- */
                for (i = 0; i <= 4; i++) {
                    t = 0.78 + 0.10 * (i / 4);
                    o.push('<path d="M ' + fx(spX(t)) + ' ' + fx(dorsY(t)) +
                           ' L ' + fx(spX(t) + 13) + ' ' + fx(dorsY(t) - 40) + '" opacity="0.85" />');
                    o.push('<path d="M ' + fx(spX(t)) + ' ' + fx(ventY(t)) +
                           ' L ' + fx(spX(t) + 12) + ' ' + fx(ventY(t) + 34) + '" opacity="0.85" />');
                }

                /* --- 尾鳍：新月形，直接长在尾柄上 --- */
                var ty = spY(1), e = X1,
                    upT = [1595, 205], loT = [1595, 485], notch = [1450, ty];
                o.push('<path d="M ' + fx(e) + ' ' + fx(ty - 10) +
                       ' C 1420 290 1512 232 ' + upT[0] + ' ' + upT[1] +
                       ' C 1524 252 1470 302 ' + notch[0] + ' ' + notch[1] +
                       ' C 1470 386 1524 436 ' + loT[0] + ' ' + loT[1] +
                       ' C 1512 458 1420 400 ' + fx(e) + ' ' + fx(ty + 10) + ' Z" />');
                for (i = 1; i <= 6; i++) {
                    u = i / 7;
                    o.push('<path d="M ' + fx(e + 4) + ' ' + fx(ty) + ' L ' +
                           fx(upT[0] + (notch[0] - upT[0]) * u) + ' ' + fx(upT[1] + (notch[1] - upT[1]) * u) +
                           '" opacity="0.42" />');
                    o.push('<path d="M ' + fx(e + 4) + ' ' + fx(ty) + ' L ' +
                           fx(loT[0] + (notch[0] - loT[0]) * u) + ' ' + fx(loT[1] + (notch[1] - loT[1]) * u) +
                           '" opacity="0.42" />');
                }

                return '<svg viewBox="0 0 1640 700" xmlns="http://www.w3.org/2000/svg" fill="none" ' +
                       'stroke="' + BONE + '" stroke-width="2.6" stroke-linecap="round" ' +
                       'stroke-linejoin="round">' + o.join('') + '</svg>';
            }

            function buildDawn() {
                return '<svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
                    '<defs>' +
                      '<radialGradient id="dgCore" cx="50%" cy="50%" r="50%">' +
                        '<stop offset="0%" stop-color="#fff8ea" stop-opacity="0.19"/>' +
                        '<stop offset="38%" stop-color="#e9dcc6" stop-opacity="0.10"/>' +
                        '<stop offset="72%" stop-color="#8fa3b0" stop-opacity="0.035"/>' +
                        '<stop offset="100%" stop-color="#000000" stop-opacity="0"/>' +
                      '</radialGradient>' +
                      '<linearGradient id="dgSky" x1="0" y1="0" x2="0" y2="1">' +
                        '<stop offset="0%" stop-color="#000000" stop-opacity="0"/>' +
                        '<stop offset="55%" stop-color="#000000" stop-opacity="0"/>' +
                        '<stop offset="100%" stop-color="#93a9b8" stop-opacity="0.09"/>' +
                      '</linearGradient>' +
                    '</defs>' +
                    '<rect width="1920" height="1080" fill="#000000"/>' +
                    '<rect width="1920" height="1080" fill="url(#dgSky)"/>' +
                    '<ellipse cx="1030" cy="500" rx="780" ry="400" fill="url(#dgCore)"/>' +
                    '</svg>';
            }

            function buildFinalScene() {
                return '<div class="final-scene">' +
                           '<div class="dawn">' + buildDawn() + '</div>' +
                           '<div class="drift">' + buildSkeleton() + '</div>' +
                       '</div>';
            }

            /* ============================================================
               封面标题：照 docs/TOMATS.pptx 第 1 页的排版
               ------------------------------------------------------------
               三行：The Old Man and the Sea / 老人与海 / Ernest Miller Hemingway
                    [美] 欧内斯特·米勒·海明威
               出现方式仿 deepseecommerce.com 的写法：把句子拆成「词」，
               每个词外面套一层 .wd（overflow:hidden）当作遮罩，里面的词块
               从下方 110% 升到位，逐词递加 animation-delay —— 文字是“升”上来的，
               不是直接亮出来的。中文按字拆（4 个字，错开大一点才看得出节奏）。
               ============================================================ */
            function rise(inner, delay, cls) {
                var d = delay.toFixed(3) + 's';
                return '<span class="' + (cls || 'wd') + '"><i style="-webkit-animation-delay:' + d +
                       ';animation-delay:' + d + '">' + inner + '</i></span>';
            }
            function riseWords(text, t0, step) {
                var parts = text.split(' '), out = [], i;
                for (i = 0; i < parts.length; i++) {
                    if (parts[i]) { out.push(rise(parts[i], t0 + i * step)); }
                }
                return out.join(' ');
            }
            /* 逐字拆成遮罩块。空格换成 &nbsp;，否则每个字都成了 inline-block 后
               空格会被吃掉（"Part One" 会粘成 "PartOne"）。 */
            function riseChars(text, t0, step) {
                var out = [], i, ch;
                for (i = 0; i < text.length; i++) {
                    ch = text.charAt(i);
                    out.push(rise(ch === ' ' ? '&nbsp;' : ch, t0 + i * step));
                }
                return out.join('');
            }

            function buildCoverTitle() {
                var T0 = TEXT_START, T = function (x) { return T0 + x; };   // 整体后移，等镜头对完焦
                return '<div class="cover-title">' +
                           '<div class="ct-en">' + riseWords('The Old Man and the Sea', T(0.25), 0.07) + '</div>' +
                           '<div class="ct-zh">' + riseChars('老人与海', T(0.42), 0.09) + '</div>' +
                           '<div class="ct-au">' + riseWords('Ernest Miller Hemingway', T(0.72), 0.04) + '</div>' +
                           '<div class="ct-au2">' +
                               rise('<span class="brk">[</span>美<span class="brk">]</span>', T(0.92)) + ' ' +
                               riseChars('欧内斯特·米勒·海明威', T(1.00), 0.035) +
                           '</div>' +
                       '</div>';
            }

            /* ============================================================
               第一页：风暴中的老人（画面素材在 assets/）
               ------------------------------------------------------------
               · Background.png  2304x1728 的完整画面（老人眼睛是睁着的）
               · OldManEyes-Closed.png  闭眼贴片，按实测眼位叠在双眼上
               · water-foam.png  由 three.js 的 waternormals.jpg 转出的白色浪花，
                 平铺 + 滚动 background-position，制造海面流动的错觉
               · man-mask.png    老人轮廓蒙版（白色=可出水，透明=老人），
                 海面的一切动静都被它挡在老人身后
               层序（由下往上）：原画 → 海面 → 柔边模糊块 → 浪纹 → 闭眼贴片，
               外面套 .rock（横摇）/.heave（垂荡），做驾驶室式的颠簸 —— 里面全部是画；
               .cover-title 放在 .rock 外面，文字不参与摇晃，只有升起动画。
               ============================================================ */
            function buildCoverScene() {
                return '<div class="cover">' +
                           '<div class="cover-intro">' +
                               '<div class="rock">' +
                                   '<div class="heave">' +
                                       '<div class="stage">' +
                                       '<img class="cover-art" alt="">' +
                                       '<canvas class="cover-gl"></canvas>' +
                                       '<div class="cover-blur"><img alt=""></div>' +
                                       '<div class="cover-waves">' +
                                           '<div class="cover-water w-far"><i></i></div>' +
                                           '<div class="cover-water w-mid"><i></i></div>' +
                                           '<div class="cover-water w-near"><i></i></div>' +
                                       '</div>' +
                                       '<div class="cover-man-wrap">' +
                                           '<div class="cover-man-inner">' +
                                               '<img class="cover-man" src="assets/OldMan-Body.png" alt="">' +
                                               '<img class="cover-eyes" src="assets/OldManEyes-Closed.png" alt="">' +
                                           '</div>' +
                                       '</div>' +
                                       '</div>' +
                                   '</div>' +
                               '</div>' +
                           '</div>' +
                           buildCoverTitle() +
                       '</div>';
            }

            /* ============================================================
               首页海面：WebGL 像素位移（真三维感）
               ------------------------------------------------------------
               把 waternormals.jpg 当法线，直接“推开” Background.png 自己的像素，
               所以画里那些浪是真的在动、还带高光反光 —— 不是在上面盖一层纹理。
               流向：画中浪自右侧卷来、脊线近水平，整体朝左下推进。
               man-mask.png 当作遮挡蒙版：老人身上位移与高光都归零，
               水因此在人的后面流动，轮廓也不会被拉扯变形。
               若 WebGL 不可用，自动退回上面那三层 CSS 浪纹（同样被蒙版挡在老人身后）。
               ============================================================ */
            function initCoverWater(imgs) {
                var cv = document.querySelector('.cover-gl');
                if (!cv) { return; }
                var cssLayers = document.querySelectorAll('.cover-water');

                function giveUp() {
                    if (cv.parentNode) { cv.parentNode.removeChild(cv); }
                }

                /* file:// 下浏览器禁止把本地图片上传给 WebGL
                   (texImage2D 抛 SecurityError)，直接用 CSS 版本 */
                if (location.protocol === 'file:') { giveUp(); return; }

                var gl = null;
                try {
                    gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
                } catch (e) { gl = null; }
                if (!gl) { giveUp(); return; }

                var VS = 'attribute vec2 p;varying vec2 vUv;' +
                         'void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';

                var FS = [
                    'precision mediump float;',
                    'uniform sampler2D uArt;',
                    'uniform sampler2D uNorm;',
                    'uniform sampler2D uOcc;',
                    'uniform vec2  uOff;',
                    'uniform vec2  uRep;',
                    'uniform float uDisp;',
                    'uniform float uSpec;',
                    'varying vec2 vUv;',
                    'float ellip(vec2 p, vec2 c, vec2 r, float soft){',
                    '    float d = length((p - c) / r);',
                    '    return 1.0 - smoothstep(1.0 - soft, 1.0, d);',
                    '}',
                    'void main(){',
                    '    vec2 ip = vec2(vUv.x, 1.0 - vUv.y);',
                    '    float sea = smoothstep(0.400, 0.520, ip.y);',
                    '    float ex = 0.0;',
                    /* 只留船这一个椭圆：人交给 man-mask.png 精确遮挡，
                       手调的椭圆留着反而会在人身旁糊出一块不动的死水 */
                    '    ex = max(ex, ellip(ip, vec2(0.780, 0.880), vec2(0.270, 0.170), 0.40));',
                    /* man-mask.png：老人身上 alpha=0 → 位移与高光都归零，
                       水就只在人的后面走，轮廓边缘也不会被拉扯 */
                    '    float occ = texture2D(uOcc, ip).a;',
                    '    float mask = sea * (1.0 - ex) * occ;',
                    '    float v = clamp((ip.y - 0.400) / 0.600, 0.0, 1.0);',
                    '    float vv = pow(v, 1.60);',
                    '    vec2 nuv = vec2(ip.x * uRep.x, vv * uRep.y) + uOff;',
                    '    vec3 n = texture2D(uNorm, nuv).xyz * 2.0 - 1.0;',
                    '    float ds = uDisp * (0.35 + 0.65 * v);',
                    '    vec3 col = texture2D(uArt, clamp(ip + n.xy * ds * mask, vec2(0.002), vec2(0.998))).rgb;',
                    '    vec3 nn = normalize(vec3(n.xy, 1.0));',
                    '    vec3 L  = normalize(vec3(-0.45, 0.55, 0.70));',
                    '    float sp = pow(max(dot(nn, L), 0.0), 28.0);',
                    '    col += vec3(0.85, 0.92, 1.00) * sp * uSpec * mask;',
                    '    gl_FragColor = vec4(col, 1.0);',
                    '}'
                ].join('\n');

                function comp(type, src) {
                    var s = gl.createShader(type);
                    gl.shaderSource(s, src);
                    gl.compileShader(s);
                    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { return null; }
                    return s;
                }
                var vsObj = comp(gl.VERTEX_SHADER, VS),
                    fsObj = comp(gl.FRAGMENT_SHADER, FS);
                if (!vsObj || !fsObj) { giveUp(); return; }

                var prog = gl.createProgram();
                gl.attachShader(prog, vsObj);
                gl.attachShader(prog, fsObj);
                gl.linkProgram(prog);
                if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { giveUp(); return; }
                gl.useProgram(prog);

                var buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
                var pLoc = gl.getAttribLocation(prog, 'p');
                gl.enableVertexAttribArray(pLoc);
                gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

                var U = {
                    art:  gl.getUniformLocation(prog, 'uArt'),
                    norm: gl.getUniformLocation(prog, 'uNorm'),
                    occ:  gl.getUniformLocation(prog, 'uOcc'),
                    off:  gl.getUniformLocation(prog, 'uOff'),
                    rep:  gl.getUniformLocation(prog, 'uRep'),
                    disp: gl.getUniformLocation(prog, 'uDisp'),
                    spec: gl.getUniformLocation(prog, 'uSpec')
                };

                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

                function makeTex(img, repeat) {
                    var t = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, t);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    return t;
                }

                /* 沿 DOM 往上找 .slide.active：中间多套几层 div（比如 .rock/.heave）也不怕 */
                function onScreen() {
                    var e = cv;
                    while (e) {
                        if (e.className && (' ' + e.className + ' ').indexOf(' active ') >= 0) { return true; }
                        e = e.parentNode;
                    }
                    return false;
                }

                /* 流向与流速：+x 让贴图向左，-y 让贴图向下（朝观者） */
                var DIR_X = 0.055, DIR_Y = -0.090;
                var artTex = null, normTex = null, occTex = null, pending = 3, broken = false;

                function resize() {
                    var w = cv.clientWidth || 1, h = cv.clientHeight || 1;
                    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
                    gl.viewport(0, 0, cv.width, cv.height);
                }

                var prev = 0, clock = 0;
                function frame(ts) {
                    requestAnimationFrame(frame);
                    var dt = prev ? (ts - prev) : 0;
                    prev = ts;
                    /* 只在首页显示时才画，省电省 GPU */
                    if (!onScreen()) { return; }
                    clock += dt / 1000;

                    resize();
                    gl.uniform1i(U.art, 0);
                    gl.uniform1i(U.norm, 1);
                    gl.uniform1i(U.occ, 2);
                    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, artTex);
                    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, normTex);
                    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, occTex);
                    gl.uniform2f(U.off, clock * DIR_X, clock * DIR_Y);
                    gl.uniform2f(U.rep, 2.2, 5.4);
                    gl.uniform1f(U.disp, 0.0045);
                    gl.uniform1f(U.spec, 0.55);
                    gl.clearColor(0, 0, 0, 1);
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                }

                function ready() {
                    if (--pending) { return; }
                    if (broken || !artTex || !normTex || !occTex) { giveUp(); return; }
                    /* WebGL 生效后关掉 CSS 浪纹，避免两套叠加 */
                    for (var i = 0; i < cssLayers.length; i++) { cssLayers[i].style.display = 'none'; }
                    requestAnimationFrame(frame);
                }

                /* 图在加载页里已经下载/解码过了，这里直接拿来上传纹理 */
                var imgA = (imgs && imgs.art) || new Image(),
                    imgN = (imgs && imgs.norm) || new Image(),
                    imgO = (imgs && imgs.occ) || new Image();

                function useTex(img, repeat, isArt, isOcc) {
                    if (!img || !img.src) { broken = true; ready(); return; }   /* 没图就别硬上，退回 CSS 浪纹 */
                    if (img.complete && img.naturalWidth) {
                        try {
                            var t = makeTex(img, repeat);
                            if (isArt) { artTex = t; } else if (isOcc) { occTex = t; } else { normTex = t; }
                        } catch (e) { broken = true; }
                        ready();
                        return;
                    }
                    img.onload = function () {
                        try {
                            var t2 = makeTex(img, repeat);
                            if (isArt) { artTex = t2; } else if (isOcc) { occTex = t2; } else { normTex = t2; }
                        } catch (e) { broken = true; }
                        ready();
                    };
                    img.onerror = function () { broken = true; ready(); };
                }

                useTex(imgA, false, true, false);
                useTex(imgN, true, false, false);
                useTex(imgO, false, false, true);
            }

            // 1. 动态生成 20 页内容
            var slides = [];
            for (var i = 1; i <= totalSlides; i++) {
                var slide = document.createElement('div');
                slide.className = 'slide' + (i === 1 ? ' active' : '');
                if (i === 1) {
                    /* 首页：风暴中的老人，一直眨眼，海面在流动 */
                    slide.innerHTML = buildCoverScene();
                } else if (i === 2) {
                    /* 目录页：水底环境 + 三个部分 */
                    slide.innerHTML = buildContentsScene();
                } else if (SCROLL_SECTIONS[i]) {
                    /* 纵向长页（第 4 页起）：一屏一段，点翻页滚动 */
                    slide.innerHTML = buildScrollScene(i, SCROLL_SECTIONS[i]);
                } else if (SECTIONS[i]) {
                    /* 章节正文页（第 3 页起）：沿用海景底板 */
                    slide.innerHTML = buildSectionScene(SECTIONS[i]);
                } else if (i === totalSlides) {
                    /* 最后一页：只有晨光与骨架，没有一个字 */
                    slide.innerHTML = buildFinalScene();
                } else {
                    slide.innerHTML = '<div class="ph"><h1>第 ' + i + ' 页</h1>' +
                                      '<p>点击屏幕上方 30% 返回上一页 | 点击下方 70% 进入下一页</p></div>';
                }
                container.appendChild(slide);
                slides.push(slide);
            }
            ensureAudioGroup(1, assetDone); // 首页环境音（海浪 + 雷声）算进加载进度
            initLoader();              // 加载页：预加载 + 进度条；完成后掀开封面

            /* ============================================================
               加载页
               ------------------------------------------------------------
               1) 预加载 7 项：背景图(候选)、老人、闭眼贴片、法线图、遮挡蒙版、两条音频
               2) 进度条 + 百分比实时跟着走
               3) 100% 后：先试播声音 →
                    能响：直接淡出加载页，封面开始对焦；
                    被拦：加载页切成「点击开始」，那一下点击就是浏览器要的交互，
                          点完立刻出声，同时掀开加载页。
               ============================================================ */


            function initLoader() {
                loaderEl = document.getElementById('loader');
                loaderBarEl = document.getElementById('loaderBar');
                loaderPctEl = document.getElementById('loaderPct');
                document.addEventListener('click', onLoadGesture, false);
                document.addEventListener('keydown', onLoadGesture, false);
                document.addEventListener('touchstart', onLoadGesture, false);
                preloadAssets();
            }

            /* 加载期间用户点了一下/按了一下：记下来，必要时用它解锁声音 */
            function onLoadGesture() {
                gestureSeen = true;
                if (tapPromptShown && !coverRevealed) {
                    playPageAudio(1);   // 在用户手势里播放，浏览器才允许出声
                    revealCover();
                }
            }

            function assetDone() {
                LOAD_DONE++;
                if (LOAD_DONE > LOAD_TOTAL) { LOAD_DONE = LOAD_TOTAL; }
                var pct = Math.round(100 * LOAD_DONE / LOAD_TOTAL);
                if (loaderBarEl) { loaderBarEl.style.width = pct + '%'; }
                if (loaderPctEl) { loaderPctEl.innerText = pct + '%'; }
                if (LOAD_DONE >= LOAD_TOTAL) { onAllLoaded(); }
            }

            function loadImageInto(url, key, done) {
                var im = new Image();
                im.onload = function () { preImgs[key] = im; done(); };
                im.onerror = function () { done(); };
                im.src = url;
            }

            function preloadAssets() {
                /* 1) 背景图：依次试候选，全都没有就退回老背景 */
                var i = 0;
                (function tryNext() {
                    if (i >= COVER_ART_TRY.length) { oceanSrc = COVER_ART_FALLBACK; hasOceanArt = false; loadImageInto(COVER_ART_FALLBACK, 'art', assetDone); return; }
                    var im = new Image();
                    im.onload = function () { oceanSrc = COVER_ART_TRY[i]; hasOceanArt = true; preImgs.art = im; assetDone(); };
                    im.onerror = function () { i++; tryNext(); };
                    im.src = COVER_ART_TRY[i];
                })();

                /* 2~5) 人、闭眼贴片、法线图、遮挡蒙版 */
                loadImageInto('assets/OldMan-Body.png', 'man', assetDone);
                loadImageInto('assets/OldManEyes-Closed.png', 'eyes', assetDone);
                loadImageInto('assets/waternormals.jpg', 'norm', assetDone);
                loadImageInto('assets/man-mask.png', 'occ', assetDone);
                /* 6~7) 两条音频由 initCoverAudio(assetDone) 计进度 */
            }

            function onAllLoaded() {
                if (loaderPctEl) { loaderPctEl.innerText = '100%'; }
                if (loaderBarEl) { loaderBarEl.style.width = '100%'; }
                applyCoverArt(oceanSrc, hasOceanArt);   // 先把画面/着色器备好（加载页还盖着，看不到跳动）
                playPageAudio(1);                       // 试着直接出声（缓入 2s）
                setTimeout(function () {
                    if (audioBlocked && !gestureSeen) {
                        tapPromptShown = true;
                        if (loaderEl) { loaderEl.className = 'need-tap'; }
                    } else {
                        revealCover();
                    }
                }, 240);
            }

            function revealCover() {
                if (coverRevealed) { return; }
                coverRevealed = true;
                if (loaderEl) { loaderEl.className = 'hide'; }
                deckLocked = false;
                coverReady = true;
                applyBodyClass();
                syncCoverIntro();          // 入场对焦动画 + 声音，从这里开始
                setTimeout(function () {
                    if (loaderEl && loaderEl.parentNode) { loaderEl.parentNode.removeChild(loaderEl); }
                    loaderEl = null;
                }, 1400);
                /* 后台把第 2 页的水底音也预取好，翻过去就立刻有声 */
                setTimeout(function () { ensureAudioGroup(2); }, 1500);
            }

            function applyCoverArt(src, hasOcean) {
                hasOceanArt = hasOcean;
                var artImg = container.querySelector('.cover-art');
                var blurImg = container.querySelector('.cover-blur img');
                var seaPhoto = container.querySelector('.sea-photo');
                if (artImg) { artImg.src = src; }
                if (blurImg) { blurImg.src = src; }
                /* 目录页的水底背景用同一张画（在 JS 里填，缺图时退回纯渐变也不报错） */
                if (seaPhoto) { seaPhoto.style.backgroundImage = 'url("' + src + '")'; }
                initCoverWater(preImgs);   // 海面着色器直接用预加载好的图，不重复下载
            }

            // 2. 更新页面显示
            function updateSlide() {
                for (var i = 0; i < slides.length; i++) {
                    if (i === currentSlide - 1) {
                        slides[i].className = 'slide active';
                    } else {
                        slides[i].className = 'slide';
                    }
                }
                applyBodyClass();
                syncCoverIntro();
                /* 声音按页切换：先停掉别的页，不是首页的立即起播（首页由 syncCoverIntro 起） */
                stopOtherPageAudio(currentSlide);
                if (currentSlide !== 1) { playPageAudio(currentSlide); }
                /* 纵向长页：每次进来都回到第一屏 */
                if (SCROLL_SECTIONS[currentSlide]) { resetScrollPage(currentSlide); }
            }

            /* 首页与尾页是纯画面：body.is-clean 收掉状态栏和触控提示；
               body.cover-ready 表示原画已经画得出来，入场动画和标题才可以开始 */
            function applyBodyClass() {
                document.body.className =
                    ((currentSlide === 1 || currentSlide === totalSlides) ? 'is-clean' : '') +
                    (coverReady ? ' cover-ready' : '') +
                    (hasOceanArt ? ' has-ocean' : '');
            }

            /* ============================================================
               入场动画控制
               ------------------------------------------------------------
               动画只挂在 .intro-run 上，播完立刻摘掉 —— 否则 blur(0) 会留着一个
               全屏滤镜层，和海面 canvas 叠在一起，老一体机上会掉帧。
               摘掉后回到基础态（= 动画终帧），画面不跳。
               ============================================================ */
            var introEl = container.querySelector('.cover-intro');

            function runCoverIntro() {
                if (!introEl) { return; }
                introEl.className = 'cover-intro';
                /* 强制回流，让“翻走再翻回来”时动画能重新播 */
                void introEl.offsetWidth;
                introEl.className = 'cover-intro intro-run';
            }

            function endCoverIntro() {
                if (!introEl) { return; }
                introEl.className = 'cover-intro';
            }

            /* 只认对焦动画自己的结束事件（内部浪纹/闭眼那些是 infinite，不会触发） */
            function onIntroAnimationEnd(e) {
                var name = e && (e.animationName || e.webkitAnimationName);
                if (name && name !== 'coverFocus') { return; }
                endCoverIntro();
            }

            function syncCoverIntro() {
                if (!introEl) { return; }
                if (coverReady && currentSlide === 1) {
                    runCoverIntro();
                    playPageAudio(1);      /* 声音跟画面同时起来，2s 缓入 */
                } else {
                    endCoverIntro();
                }
            }

            if (introEl) {
                introEl.addEventListener('animationend', onIntroAnimationEnd, false);
                introEl.addEventListener('webkitAnimationEnd', onIntroAnimationEnd, false);
            }

            /* 柔焦块的浮现时间 = 文字第一个词出现的那一刻（TEXT_START + 0.25），
               在这里注入而不是写死在 CSS 里，免得改 TEXT_START 时两边对不上 */
            var coverBlurEl = container.querySelector('.cover-blur');
            if (coverBlurEl) {
                var veilDelay = (TEXT_START + 0.25).toFixed(2) + 's';
                coverBlurEl.style.webkitAnimationDelay = veilDelay;
                coverBlurEl.style.animationDelay = veilDelay;
            }

            /* ============================================================
               首页环境音
               ------------------------------------------------------------
               画面一出现就开始播，音量 2 秒缓入；离开第一页缓出 0.7s 并停掉，
               回到第一页重新开始。
               浏览器可能拦“带声音的自动播放”，两种应对：
                 1. 若被拦：先静音播起来（静音自动播放一定放行），画面照常对焦，
                    等第一次点击/按键再取消静音 —— 声音照样是 2s 缓入；
                 2. 想彻底免掉那次交互，给一体机上的 Chrome 快捷方式加启动参数
                    --autoplay-policy=no-user-gesture-required
               ============================================================ */
            /* 按页建播放器（同一页只建一次）；每条就绪时回调一次，供加载页计进度 */
            function ensureAudioGroup(page, onEachReady) {
                if (audioByPage[page]) { return audioByPage[page]; }
                var defs = AUDIO_PAGES[page] || [], list = [], i, a;
                for (i = 0; i < defs.length; i++) {
                    try { a = new Audio(defs[i].src); } catch (e) { if (onEachReady) { onEachReady(); } continue; }
                    a.loop = true;
                    a.preload = 'auto';
                    a.volume = 0;
                    a.__target = defs[i].vol;
                    list.push(a);
                    hookAudioReady(a, onEachReady);
                }
                audioByPage[page] = list;
                return list;
            }

            /* 能播了就算“就绪”（算进进度条）；出错或超时也不卡住加载页 */
            function hookAudioReady(a, cb) {
                var fired = false;
                var once = function () {
                    if (fired) { return; }
                    fired = true;
                    if (cb) { cb(); }
                };
                a.addEventListener('canplay', once, false);
                a.addEventListener('error', once, false);
                setTimeout(once, 6000);
            }

            /* 音量渐变：按真实时间推进（setInterval 本身会漂移，用时间戳算比例才准），
               结束时可选停掉并回到开头 */
            function fadeAudio(a, to, ms, thenStop) {
                if (a.__fadeId) { clearInterval(a.__fadeId); a.__fadeId = null; }
                var from = a.volume, t0 = (new Date()).getTime(), k, v;
                a.__fadeId = setInterval(function () {
                    k = ms <= 0 ? 1 : (((new Date()).getTime() - t0) / ms);
                    if (k > 1) { k = 1; }
                    v = from + (to - from) * k;
                    if (v < 0) { v = 0; } else if (v > 1) { v = 1; }
                    try { a.volume = v; } catch (e) {}
                    if (k >= 1) {
                        clearInterval(a.__fadeId);
                        a.__fadeId = null;
                        if (thenStop) {
                            try { a.pause(); a.currentTime = 0; } catch (e) {}
                        }
                    }
                }, 40);
            }

            /* 播放某一页的环境音 */
            function playPageAudio(page) {
                var list = ensureAudioGroup(page), i;
                for (i = 0; i < list.length; i++) { playOne(list[i]); }
            }

            /* 停掉除这一页以外的所有声音 */
            function stopOtherPageAudio(page) {
                var k, list, i;
                for (k in audioByPage) {
                    if (!audioByPage.hasOwnProperty(k)) { continue; }
                    if (parseInt(k, 10) === page) { continue; }
                    list = audioByPage[k];
                    for (i = 0; i < list.length; i++) { fadeAudio(list[i], 0, FADE_OUT_MS, true); }
                }
            }

            function playOne(a) {
                var failed = false;
                try {
                    if (a.paused) { a.currentTime = 0; }
                    a.muted = false;
                    var p = a.play();
                    /* 自动播放被拦（NotAllowedError）：转静音播放 + 等交互 */
                    if (p && typeof p['catch'] === 'function') {
                        p['catch'](function () { playOneMuted(a); });
                    }
                } catch (e) { failed = true; }
                if (failed) { playOneMuted(a); return; }
                fadeAudio(a, a.__target, FADE_IN_MS, false);
            }

            function playOneMuted(a) {
                try { a.volume = 0; } catch (e) {}
                try { a.muted = true; a.play(); } catch (e) {}
                if (!audioBlocked) {
                    audioBlocked = true;   // 被别人拦了：交给加载页决定是等一次点击还是直接进
                }
                armAudioUnlock();
            }

            /* 静音兜底时才需要：用户第一次点击/按键/触摸时取消静音，2s 缓入 */
            var audioUnlockArmed = false;
            function armAudioUnlock() {
                if (audioUnlockArmed) { return; }
                audioUnlockArmed = true;
                var handler = function () {
                    document.removeEventListener('click', handler, false);
                    document.removeEventListener('keydown', handler, false);
                    document.removeEventListener('touchstart', handler, false);
                    audioUnlockArmed = false;
                    playPageAudio(currentSlide);
                };
                document.addEventListener('click', handler, false);
                document.addEventListener('keydown', handler, false);
                document.addEventListener('touchstart', handler, false);
            }

            // 3. 下一页
            function nextSlide() {
                if (deckLocked || isTransitioning) return;   /* 加载页还在时不许翻页 */
                if (currentSlide >= totalSlides) { return; }
                /* 纵向长页：先把页内往下滚一屏；已经到底了才真正翻页 */
                if (scrollNextStop(currentSlide)) { return; }
                isTransitioning = true;
                if (currentSlide === 1) {
                    /* 首页 -> 第 2 页：镜头推进到浪里，再淡入淡出换页 */
                    zoomOutFromCover();
                    setTimeout(function () { isTransitioning = false; }, ZOOM_MS + 700);
                    return;
                }
                currentSlide++;
                updateSlide();
                setTimeout(function() { isTransitioning = false; }, 400);
            }

            /* ============================================================
               首页 -> 下一页的转场
               ------------------------------------------------------------
               整幅画面向「右上方那道大浪」推近（放大 2.35 倍，原点 78%/28%），
               同时老人往左让开 30%，把浪的位置腾出来；推到位后交给 .slide 的
               0.4s 透明度过渡完成淡入淡出。推近途中标题先淡出。
               具体数值在 CSS 的 .cover-zoom 里，改的时候两边一起改。
               ============================================================ */
            var ZOOM_MS = 1100;          // 推近时长（CSS 里的 1.1s）

            function coverNode() {
                return container.querySelector('.cover');
            }

            function zoomOutFromCover() {
                var cv = coverNode();
                if (!cv) {
                    currentSlide++;
                    updateSlide();
                    return;
                }
                cv.className = 'cover cover-zoom';
                setTimeout(function () {
                    currentSlide++;
                    updateSlide();                 /* 这里切页：声音也跟着换 */
                    setTimeout(function () { cv.className = 'cover'; }, 520);  /* 等淡出走完再复原 */
                }, ZOOM_MS);
            }

            // 5. 上一页
            function prevSlide() {
                if (deckLocked || isTransitioning) return;   /* 加载页还在时不许翻页 */
                /* 纵向长页：先把页内往上滚一屏；已经在第一屏才真正翻页 */
                if (scrollPrevStop(currentSlide)) { return; }
                if (currentSlide > 1) {
                    isTransitioning = true;
                    currentSlide--;
                    updateSlide();
                    setTimeout(function() { isTransitioning = false; }, 400);
                }
            }

            // 6. 键盘事件监听（翻页笔）
            document.addEventListener('keydown', function(event) {
                var key = event.key;
                var keyCode = event.keyCode;

                // 下一页：PageDown, ArrowRight, Space
                if (key === 'PageDown' || key === 'ArrowRight' || key === ' ' || keyCode === 34 || keyCode === 39 || keyCode === 32) {
                    nextSlide();
                    event.preventDefault();
                }
                // 上一页：PageUp, ArrowLeft
                else if (key === 'PageUp' || key === 'ArrowLeft' || keyCode === 33 || keyCode === 37) {
                    prevSlide();
                    event.preventDefault();
                }
            });

            // 7. 触屏/鼠标点击热区
            // 点击上方 30% -> 上一页
            document.getElementById('zone-top').addEventListener('click', function() {
                prevSlide();
            });

            // 点击下方 70% -> 下一页
            document.getElementById('zone-bottom').addEventListener('click', function() {
                nextSlide();
            });

            // 8. 防止触摸时页面跟着滚动
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            /* 纵向长页：滚轮也能推，滚动时同步“哪一屏已出现”和进度条 */
            document.addEventListener('wheel', function (e) {
                var el = spElOf(currentSlide);
                if (!el || deckLocked) { return; }
                el.scrollTop = el.scrollTop + (e.deltaY || 0);
                revealStops(el);
            }, false);

            /* scroll 事件不冒泡，用捕获阶段接住长页容器自己的滚动 */
            document.addEventListener('scroll', function (e) {
                var t = e.target;
                if (t && t.className && (' ' + t.className + ' ').indexOf(' scroll-page ') >= 0) {
                    revealStops(t);
                }
            }, true);

            /* 9. 开场：等上面所有函数/引用都就位，再统一启动一次
                  （首次 updateSlide 会同步 body 类名、入场动画、声音）
                  —— 注意入场动画和声音都由 initCoverArt 的回调在“背景图就绪”后触发，
                     不是在这里，所以不会出现白字先飘在纯黑背景上的情况 */
            updateSlide();

        })();
    </script>
</body>
</html>
