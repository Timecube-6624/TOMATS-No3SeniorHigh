<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>触屏+翻页笔兼容性测试（20页）</title>
    <style>
        /* ====== 极简高对比度样式，兼容老旧浏览器 ====== */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* 幻灯片容器 */
        #slide-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none; 
        }
        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 8vw;
            margin: 0 0 20px 0;
            text-align: center;
        }
        p {
            font-size: 4vw;
            color: #aaa;
            text-align: center;
        }

        /* ====== 触控热区（符合你的要求：上30%上一页，下70%下一页） ====== */
        .touch-zone {
            position: fixed;
            left: 0;
            width: 100%;
            z-index: 100; /* 确保在幻灯片之上，能捕获点击 */
            cursor: pointer;
        }
        
        /* 顶部 30% 区域：上一页 */
        #zone-top {
            top: 0;
            height: 30%;
            /* 加一个极淡的渐变提示，方便你测试时看清边界，不需要可删掉下面这行 */
            background: linear-gradient(to bottom, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        }
        
        /* 底部 70% 区域：下一页 */
        #zone-bottom {
            top: 30%;
            height: 70%;
        }

        /* ====== 最后一页：微弱的晨光 + 一副漂浮的白色鱼骨架 ====== */
        .final-scene {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 晨光：从黑暗中缓缓浮现，始终极弱 */
        .dawn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0; /* 未进入本页时不可见 */
        }
        .dawn svg { display: block; width: 100%; height: 100%; }
        /* 只在“本页处于激活状态”时播放，返回再进入会自动重播 */
        .slide.active .dawn {
            -webkit-animation: dawnIn 4.2s ease-out 0.25s forwards;
            animation: dawnIn 4.2s ease-out 0.25s forwards;
        }

        /* 骨架：在黑暗中极缓慢地漂浮 */
        .drift {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .drift svg { display: block; width: 90%; height: auto; }
        .slide.active .drift {
            -webkit-animation: driftFloat 11s ease-in-out infinite alternate;
            animation: driftFloat 11s ease-in-out infinite alternate;
        }

        @-webkit-keyframes dawnIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes dawnIn { from { opacity: 0; } to { opacity: 1; } }

        @-webkit-keyframes driftFloat {
            from { -webkit-transform: translateY(6px) rotate(-0.4deg); }
            to   { -webkit-transform: translateY(-8px) rotate(0.5deg); }
        }
        @keyframes driftFloat {
            from { transform: translateY(6px) rotate(-0.4deg); }
            to   { transform: translateY(-8px) rotate(0.5deg); }
        }

        /* ====== 加载页 ======
           样式照 deepseecommerce.com 的 preloader：整屏压黑、中间字标、
           底部细进度条 + 大号百分比，加载完淡出。
           它顺便解决自动播放：浏览器要求“用户有过交互”才允许出声，
           如果到 100% 还是被拦，这里就显示「点击开始」—— 那一下点击就是它要的交互。 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            background: #000;
            color: #fff;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            box-sizing: border-box;
            opacity: 1;
            -webkit-transition: opacity 0.8s ease;
            transition: opacity 0.8s ease;
        }
        #loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-mark { text-align: center; }
        .loader-mark .lm-zh {
            font-family: "MiSans Heavy", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-weight: 800;
            font-size: 5vw;
            line-height: 1.2;
            letter-spacing: 0.02em;
            opacity: 0;
            -webkit-animation: loaderIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
            animation: loaderIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }
        .loader-mark .lm-en {
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
            font-size: 1vw;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 1.1vw;
            padding-left: 0.4em;      /* 补掉 letter-spacing 造成的右偏 */
            opacity: 0;
            -webkit-animation: loaderIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            animation: loaderIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }
        @-webkit-keyframes loaderIn {
            from { opacity: 0; -webkit-transform: translateY(16px); }
            to   { opacity: 1; -webkit-transform: translateY(0); }
        }
        @keyframes loaderIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 底部的百分比 + 细进度条（和参考站一样：走满整屏宽） */
        .loader-bottom {
            position: absolute;
            left: 0;
            bottom: 5vh;
            width: 100%;
            padding: 0 8vw;
            box-sizing: border-box;
        }
        .loader-pct {
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
            font-size: 2vw;
            letter-spacing: 0.04em;
            color: #f2f2f2;
            margin-bottom: 1.4vh;
        }
        .loader-bar {
            position: relative;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.16);
            overflow: hidden;
        }
        .loader-bar i {
            display: block;
            height: 100%;
            width: 0;
            background: #ffffff;
            -webkit-transition: width 0.28s ease-out;
            transition: width 0.28s ease-out;
        }
        /* 到 100% 仍被浏览器拦自动播放时，换成「点击开始」 */
        .loader-tap {
            display: none;
            font-size: 1.5vw;
            letter-spacing: 0.24em;
            color: #ffffff;
            margin-bottom: 1.4vh;
            -webkit-animation: loaderTap 1.8s ease-in-out infinite;
            animation: loaderTap 1.8s ease-in-out infinite;
        }
        #loader.need-tap .loader-pct { display: none; }
        #loader.need-tap .loader-tap { display: block; }
        @-webkit-keyframes loaderTap { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
        @keyframes loaderTap { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

        /* ====== 第二页：目录（水底环境）======
           排版语言照 deepseecommerce.com：小字距大写标签、超大标题、负字距、
           细分割线从左侧 scaleX 长出来、少量青色点缀；
           环境用五层叠出来 —— 深水渐变 / 模糊海水底 / 焦散光斑 / 光柱 / 悬浮颗粒。 */
        .sea-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04121a;
        }
        /* 深水：上浅下深，顶部一点水面透光 */
        .sea-deep {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                -webkit-radial-gradient(120% 85% at 50% -18%, rgba(126, 214, 232, 0.30) 0%, rgba(32, 116, 138, 0.16) 34%, rgba(4, 24, 32, 0) 64%),
                -webkit-linear-gradient(to bottom, #0d2f3a 0%, #08202a 36%, #04141c 68%, #010a0e 100%);
            background:
                radial-gradient(120% 85% at 50% -18%, rgba(126, 214, 232, 0.30) 0%, rgba(32, 116, 138, 0.16) 34%, rgba(4, 24, 32, 0) 64%),
                linear-gradient(to bottom, #0d2f3a 0%, #08202a 36%, #04141c 68%, #010a0e 100%);
        }
        /* 模糊的海水底（背景图由 JS 填，和封面用同一张） */
        .sea-photo {
            position: absolute;
            top: -8%;
            left: -8%;
            width: 116%;
            height: 116%;
            background-size: cover;
            background-position: 50% 70%;
            background-repeat: no-repeat;
            opacity: 0.5;
            -webkit-filter: blur(16px) saturate(0.6) brightness(0.45) hue-rotate(-14deg);
            filter: blur(16px) saturate(0.6) brightness(0.45) hue-rotate(-14deg);
        }
        /* 水底焦散光斑：拿浪花图当光斑纹理，慢慢漂 */
        .sea-caustics {
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background-image: url("assets/water-foam.png");
            background-repeat: repeat;
            background-size: 46% auto;
            opacity: 0.09;
            -webkit-filter: blur(2px);
            filter: blur(2px);
            /* 慢漂：200 秒走 22%，约 3px/s —— 太快会显得水在"流"，而不是水底在动 */
            -webkit-animation: seaCaustics 200s linear infinite;
            animation: seaCaustics 200s linear infinite;
        }
        @-webkit-keyframes seaCaustics {
            from { -webkit-transform: translate3d(0, 0, 0); }
            to   { -webkit-transform: translate3d(-22%, 6%, 0); }
        }
        @keyframes seaCaustics {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(-22%, 6%, 0); }
        }
        /* 光柱：从水面斜插下来，缓慢摆 */
        .sea-rays i {
            position: absolute;
            top: -45%;
            height: 165%;
            background: -webkit-linear-gradient(to bottom, rgba(188, 238, 252, 0.26) 0%, rgba(188, 238, 252, 0.05) 46%, rgba(188, 238, 252, 0) 74%);
            background: linear-gradient(to bottom, rgba(188, 238, 252, 0.26) 0%, rgba(188, 238, 252, 0.05) 46%, rgba(188, 238, 252, 0) 74%);
            -webkit-filter: blur(7px);
            filter: blur(7px);
            -webkit-transform-origin: top center;
            transform-origin: top center;
            -webkit-animation: raySway 13s ease-in-out infinite alternate;
            animation: raySway 13s ease-in-out infinite alternate;
        }
        @-webkit-keyframes raySway {
            from { -webkit-transform: skewX(-11deg) rotate(-1.6deg); }
            to   { -webkit-transform: skewX(-11deg) rotate(1.6deg); }
        }
        @keyframes raySway {
            from { transform: skewX(-11deg) rotate(-1.6deg); }
            to   { transform: skewX(-11deg) rotate(1.6deg); }
        }
        /* 悬浮颗粒：慢慢往上飘 */
        .sea-motes i {
            position: absolute;
            bottom: -4vh;
            border-radius: 50%;
            background: rgba(214, 246, 255, 0.6);
            -webkit-animation-name: moteRise;
            animation-name: moteRise;
            -webkit-animation-timing-function: linear;
            animation-timing-function: linear;
            -webkit-animation-iteration-count: infinite;
            animation-iteration-count: infinite;
        }
        @-webkit-keyframes moteRise {
            0%   { -webkit-transform: translate3d(0, 0, 0); opacity: 0; }
            12%  { opacity: 0.85; }
            88%  { opacity: 0.5; }
            100% { -webkit-transform: translate3d(4vw, -96vh, 0); opacity: 0; }
        }
        @keyframes moteRise {
            0%   { transform: translate3d(0, 0, 0); opacity: 0; }
            12%  { opacity: 0.85; }
            88%  { opacity: 0.5; }
            100% { transform: translate3d(4vw, -96vh, 0); opacity: 0; }
        }
        .sea-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: -webkit-radial-gradient(115% 95% at 50% 42%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.58) 100%);
            background: radial-gradient(115% 95% at 50% 42%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.58) 100%);
        }

        /* ---- 目录条目 ---- */
        .toc {
            position: absolute;
            left: 11vw;
            right: 11vw;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
        }
        .toc-label {
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
            font-size: 0.95vw;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: rgba(186, 232, 245, 0.62);
            margin-bottom: 3.4vh;
            padding-left: 0.34em;
        }
        .toc-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .toc-row, .toc-end {
            position: relative;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: baseline;
            align-items: baseline;
        }
        .toc-row { padding: 2.5vh 0 2.7vh 0; }
        .toc-end { height: 0; }
        /* 分割线：从左侧长出来（参考站的做法） */
        .toc-row::before, .toc-end::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 1px;
            background: rgba(186, 232, 245, 0.22);
            -webkit-transform: scaleX(0);
            transform: scaleX(0);
            -webkit-transform-origin: left center;
            transform-origin: left center;
        }
        .slide.active .toc-row::before,
        .slide.active .toc-end::before {
            -webkit-animation: tocLine 1.05s cubic-bezier(0.22, 1, 0.36, 1) both;
            animation: tocLine 1.05s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @-webkit-keyframes tocLine {
            from { -webkit-transform: scaleX(0); }
            to   { -webkit-transform: scaleX(1); }
        }
        @keyframes tocLine {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }
        @-webkit-keyframes tocFadeUp {
            from { opacity: 0; -webkit-transform: translateY(12px); }
            to   { opacity: 1; -webkit-transform: translateY(0); }
        }
        @keyframes tocFadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .toc-idx {
            -webkit-flex: none;
            flex: none;
            width: 9vw;
            font-family: "MiSans Heavy", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 2.9vw;
            font-weight: 800;
            line-height: 1;
            color: rgba(122, 214, 232, 0.75);
        }
        .toc-name {
            font-family: "MiSans Heavy", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 4.1vw;
            font-weight: 800;
            line-height: 1.06;
            letter-spacing: 0.02em;
            color: #f2f2f2;
        }
        .toc-en {
            margin-left: auto;
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
            font-size: 0.95vw;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(186, 232, 245, 0.5);
            padding-left: 2em;
        }

        /* ---- 第 3 页起：章节正文页 ---- */
        .sec {
            position: absolute;
            left: 11vw;
            right: 11vw;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            max-width: 68vw;
            text-align: left;          /* 顶掉全局 p{text-align:center} 的影响 */
        }
        .sec-label {
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
            font-size: 0.92vw;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(186, 232, 245, 0.62);
            padding-left: 0.32em;
            text-align: left;
        }
        .sec-title {
            margin: 2.2vh 0 0 0;
            font-family: "MiSans Heavy", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-weight: 800;
            font-size: 3.6vw;
            line-height: 1.14;
            letter-spacing: 0.01em;
            color: #f2f2f2;
            text-align: left;
        }
        /* 标题下面的细线：和目录页一样，从左侧长出来 */
        .sec-rule {
            position: relative;
            height: 1px;
            margin: 3.1vh 0 3vh 0;
            background: rgba(186, 232, 245, 0.22);
            -webkit-transform: scaleX(0);
            transform: scaleX(0);
            -webkit-transform-origin: left center;
            transform-origin: left center;
        }
        .slide.active .sec-rule {
            -webkit-animation: tocLine 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.62s both;
            animation: tocLine 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.62s both;
        }
        .sec-sub {
            font-family: "MiSans", "MiSans Heavy", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 1.62vw;
            line-height: 1.4;
            letter-spacing: 0.01em;
            color: rgba(134, 224, 242, 0.95);
            text-align: left;
        }
        .sec-body {
            margin: 3.6vh 0 0 0;
            max-width: 64vw;            /* 最长一句约 59vw，留 5vw 余量，保证一句一行 */
            font-family: "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 1.45vw;
            line-height: 1.95;
            letter-spacing: 0.01em;
            color: rgba(230, 241, 246, 0.86);
            text-align: left;           /* 同上：正文必须左对齐 */
        }
        .sec-body .ln { display: block; text-align: left; }
        /* 正文每行一个遮罩块：按基线对齐（和普通段落一致），行高收小让升起行程不至于太长 */
        .sec-body .ln .wd {
            line-height: 1.3;
            vertical-align: baseline;
            padding-bottom: 0.12em;
            margin-bottom: -0.12em;
        }

        /* ---- 顶部固定标题区：滚动时不动 ----
           高度按 30vh 预留，下面的 .scroll-page 从 30vh 开始（两处要一起改） */
        .pin-head {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 9vh 11vw 0 11vw;
            box-sizing: border-box;
            text-align: left;
            pointer-events: none;
        }
        .pin-label {
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
            font-size: 0.92vw;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(186, 232, 245, 0.62);
            padding-left: 0.32em;
        }
        .pin-title {
            margin: 2vh 0 0 0;
            font-family: "MiSans Heavy", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-weight: 800;
            font-size: 3.2vw;
            line-height: 1.16;
            letter-spacing: 0.01em;
            color: #f2f2f2;
            max-width: 78vw;
        }
        .pin-rule {
            height: 1px;
            width: 78vw;
            margin: 2.4vh 0 2.2vh 0;
            background: rgba(186, 232, 245, 0.22);
            -webkit-transform: scaleX(0);
            transform: scaleX(0);
            -webkit-transform-origin: left center;
            transform-origin: left center;
            -webkit-transition: -webkit-transform 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s;
            transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s;
        }
        .slide.active .pin-rule {
            -webkit-transform: scaleX(1);
            transform: scaleX(1);
        }
        /* 蓝色小标题：多条叠在一起，按滚动位置切换显示（同一位置，高度不跳） */
        .pin-sub {
            position: relative;
            height: 2.3vw;
            font-family: "MiSans Demibold", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 1.5vw;
            line-height: 1.4;
            letter-spacing: 0.01em;
            color: rgba(134, 224, 242, 0.95);
        }
        .pin-sub-line {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            white-space: nowrap;
            opacity: 0;
            -webkit-transition: opacity 0.32s ease;
            transition: opacity 0.32s ease;
        }
        .pin-sub-line.on { opacity: 1; }
        /* 切到这一条时，字再逐个升起一次 */
        .pin-sub-line.on .sw > i {
            -webkit-animation: swRise 0.7s cubic-bezier(0.25, 1, 0.5, 1) both;
            animation: swRise 0.7s cubic-bezier(0.25, 1, 0.5, 1) both;
        }

        /* ---- 第 4 页起：纵向滚动的长页 ----
           每个 .sp-stop 占满一屏，点「下一页」就是平滑滚到下一段的位置；
           海景底板固定在背后不随滚动走（视差感）。 */
        .scroll-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .sp-inner { position: relative; }
        /* 下面压着固定标题区：滚动区从 30vh 起、高 70vh（和 .pin-head 的预留高度对应） */
        .scroll-page.under-head {
            top: 30vh;
            height: 70vh;
        }
        /* 正文顶对齐，紧贴在标题下面，不再上下居中留一大片空 */
        .scroll-page.under-head .sp-stop {
            min-height: 70vh;
            padding: 2.4vh 11vw 5vh 11vw;
            -webkit-justify-content: flex-start;
            justify-content: flex-start;
        }
        /* 没滚到的整屏先整体透明，避免它在视口下沿“露头” */
        .sp-stop {
            opacity: 0;
            -webkit-transition: opacity 0.45s ease;
            transition: opacity 0.45s ease;
        }
        .sp-stop.is-in { opacity: 1; }
        /* 隐藏原生滚动条（Chrome/Safari 用伪元素，Firefox 用 scrollbar-width） */
        .scroll-page::-webkit-scrollbar { width: 0; height: 0; }
        .scroll-page { scrollbar-width: none; -ms-overflow-style: none; }
        .sp-stop {
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 14vh 11vw;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: flex-start;
            align-items: flex-start;
            text-align: left;
        }
        .sp-label {
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
            font-size: 0.92vw;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(186, 232, 245, 0.62);
            padding-left: 0.32em;
        }
        .sp-title {
            margin: 2.4vh 0 0 0;
            font-family: "MiSans Heavy", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-weight: 800;
            font-size: 3.25vw;
            line-height: 1.24;
            letter-spacing: 0.01em;
            color: #f2f2f2;
            max-width: 72vw;
        }
        .sp-rule {
            height: 1px;
            width: 100%;
            max-width: 66vw;
            margin: 3.4vh 0 0 0;
            background: rgba(186, 232, 245, 0.22);
            -webkit-transform: scaleX(0);
            transform: scaleX(0);
            -webkit-transform-origin: left center;
            transform-origin: left center;
            -webkit-transition: -webkit-transform 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
            transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
        }
        .sp-stop.is-in .sp-rule {
            -webkit-transform: scaleX(1);
            transform: scaleX(1);
        }
        .sp-text {
            margin: 0;
            max-width: 58vw;
            font-family: "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 1.72vw;
            line-height: 2.0;
            letter-spacing: 0.01em;
            color: rgba(231, 242, 246, 0.88);
            text-align: left;
        }
        .sp-text strong {
            color: rgba(134, 224, 242, 0.98);
            font-weight: 800;
        }
        /* 滚到的段落才播逐字动画。
           这里不用「遮罩切字」那套 —— 每个字独立裁切，升起过程中会露出半截字，
           看着像文字泄露；改成「淡入 + 轻微上浮」，任何一帧都是完整字形。 */
        .sw {
            display: inline-block;
            vertical-align: baseline;
        }
        .sw > i {
            display: inline-block;
            font-style: normal;
            opacity: 0;
            -webkit-transform: translateY(0.5em);
            transform: translateY(0.5em);
        }
        .sp-stop.is-in .sw > i {
            -webkit-animation: swRise 0.8s cubic-bezier(0.25, 1, 0.5, 1) both;
            animation: swRise 0.8s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        @-webkit-keyframes swRise {
            from { opacity: 0; -webkit-transform: translateY(0.5em); }
            to   { opacity: 1; -webkit-transform: translateY(0); }
        }
        @keyframes swRise {
            from { opacity: 0; transform: translateY(0.5em); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* 右侧细进度条：告诉讲者下面还有 */
        .sp-progress {
            position: absolute;
            right: 4.2vw;
            top: 50%;
            width: 1px;
            height: 24vh;
            margin-top: -12vh;
            background: rgba(186, 232, 245, 0.16);
            pointer-events: none;
        }
        .sp-progress i {
            display: block;
            width: 100%;
            height: 0;
            background: rgba(186, 232, 245, 0.8);
            -webkit-transition: height 0.4s ease;
            transition: height 0.4s ease;
        }

        /* 占位页的文字也走同一套淡入上浮 */
        .ph { text-align: center; }
        .slide.active .ph {
            -webkit-animation: tocFadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
            animation: tocFadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }

        /* ====== 第一页：风暴中的老人 ======
           画面按 Background.png 的原始比例(2304x1728)做成舞台，
           这样“闭眼”贴片可以直接用画面像素坐标摆放，不会随窗口比例漂移。 */
        .cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* 整幅画面像货轮驾驶室那样晃：绕镜头轴横摇(roll) + 上下垂荡(heave)。
           两层套着做，各有各的周期（15s / 9s）—— 叠起来不会像单一正弦那样呆板，
           45 秒才重合一次，接近真船的复合摇摆。
           横摇要吃掉画面四角，所以舞台放大 6%（各边约 3vw 出血）；按最紧的
           4:3 窗口算，1.2° 横摇 + 0.5% 垂荡只需要 1.038 倍，留了 2% 余量。 */
        .rock, .heave {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* 横摇：正负 1.2°，像船在涌浪里左右倾 */
        .slide.active .rock {
            -webkit-animation: coverRoll 10s ease-in-out infinite alternate;
            animation: coverRoll 10s ease-in-out infinite alternate;
        }
        /* 垂荡：正负 0.5% 视口高度，配合横摇给出实感 */
        .slide.active .heave {
            -webkit-animation: coverHeave 6s ease-in-out infinite alternate;
            animation: coverHeave 6s ease-in-out infinite alternate;
        }
        @-webkit-keyframes coverRoll {
            from { -webkit-transform: translate3d(0, 0, 0) rotate(-1.2deg); }
            to   { -webkit-transform: translate3d(0, 0, 0) rotate(1.2deg); }
        }
        @keyframes coverRoll {
            from { transform: translate3d(0, 0, 0) rotate(-1.2deg); }
            to   { transform: translate3d(0, 0, 0) rotate(1.2deg); }
        }
        @-webkit-keyframes coverHeave {
            from { -webkit-transform: translate3d(0, 0.5%, 0); }
            to   { -webkit-transform: translate3d(0, -0.5%, 0); }
        }
        @keyframes coverHeave {
            from { transform: translate3d(0, 0.5%, 0); }
            to   { transform: translate3d(0, -0.5%, 0); }
        }

        .stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 106vw;
            height: 79.5vw;        /* 4:3；配合下面两行 min-* 变成 cover 铺满（已含 6% 摇摆余量） */
            min-width: 141.3333vh;
            min-height: 106vh;
            transform: translate(-50%, -50%);
        }
        .stage img, .stage div { position: absolute; }
        .cover-art {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        /* WebGL 海面画布，压在原画之上、闭眼贴片之下 */
        .cover-gl {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ====== PPT 第 1 页那块「柔边模糊」======
           PPT 里是一张已模糊的同款画（image2.png）+ softEdge 990600EMU，
           摆在 slide 的 (3.177%, 10.948%)、大小 57.76% x 76.48%，
           取自原画 (2.872%, 23.525%) 起、52.213% x 51.852% 那一块 —— 1:1 不拉伸。
           这里不另存图片：直接再贴一次 Background.png，用 filter: blur 做模糊、
           用径向遮罩做柔边，省掉 1.6MB 素材，效果一样。
           它在 .stage 里，所以跟着画一起摇 —— 文字不摇，糊的背景摇。 */
        .cover-blur {
            position: absolute;
            left: 2.872%;
            top: 23.525%;
            width: 52.213%;
            height: 51.852%;
            -webkit-filter: blur(1.5vw);
            filter: blur(1.5vw);
            -webkit-mask-image: radial-gradient(closest-side, rgba(0,0,0,1) 42%, rgba(0,0,0,0) 100%);
            -webkit-mask-size: 100% 100%;
            -webkit-mask-repeat: no-repeat;
            mask-image: radial-gradient(closest-side, rgba(0,0,0,1) 42%, rgba(0,0,0,0) 100%);
            mask-size: 100% 100%;
            mask-repeat: no-repeat;
        }
        /* 同一张画、同一比例：把原画放大到和舞台 1:1，再平移出要取的那块 */
        .cover-blur img {
            left: -5.5012%;
            top: -45.370%;
            width: 191.524%;
            height: 192.858%;
        }
        /* 柔焦块随文字一起浮出来（延迟由 JS 按 TEXT_START 注入）：
           基础态本来就是不透明的，靠 animation 的 backwards 填充在文字出现前保持透明，
           这样翻走时柔焦不会“突然变清”。
           能改的只有时长 1.7s 和关键帧；起始时间在 TEXT_START + 0.25。 */
        .cover-ready .slide.active .cover-blur {
            -webkit-animation: blurVeil 1.7s ease-out both;
            animation: blurVeil 1.7s ease-out both;
        }
        @-webkit-keyframes blurVeil { from { opacity: 0; } to { opacity: 1; } }
        @keyframes blurVeil { from { opacity: 0; } to { opacity: 1; } }

        /* ---- 海面：三层「远/中/近」----
           画里左侧浪脊近水平、向右上收敛，巨浪自右侧卷下，所以水整体流向左下。
           三层尺寸由小到大、速度由慢到快 → 透视缩放 + 运动视差，产生纵深。
           每层位移正好一个贴图块，循环处无缝；用 transform 而非 background-position，
           是为了交给合成器，老旧一体机上不掉帧。
           三层外面再包一个 .cover-waves，用 man-mask.png 把老人挖掉：
           水只在人的后面走，不会盖到他身上。
           （man-mask.png 由 tools/make-man-mask.ps1 从 OldMan-Body.png 生成） */
        .cover-waves {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-mask-image: url("assets/man-mask.png");
            -webkit-mask-size: 100% 100%;
            -webkit-mask-position: 0 0;
            -webkit-mask-repeat: no-repeat;
            mask-image: url("assets/man-mask.png");
            mask-size: 100% 100%;
            mask-position: 0 0;
            mask-repeat: no-repeat;
        }
        .cover-water {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .cover-water i {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            display: block;
            background-image: url("assets/water-foam.png");
            background-repeat: repeat;
            will-change: transform;
        }

        /* 远：浪纹最细、最慢，压在地平线附近 */
        .w-far {
            opacity: 0.10;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 29%, rgba(0,0,0,.9) 41%, rgba(0,0,0,0) 55%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 29%, rgba(0,0,0,.9) 41%, rgba(0,0,0,0) 55%);
        }
        .w-far i { background-size: 208px 80px; }
        .slide.active .w-far i {
            -webkit-animation: waterFar 48s linear infinite;
            animation: waterFar 48s linear infinite;
        }

        /* 中：主海面 */
        .w-mid {
            opacity: 0.13;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 37%, rgba(0,0,0,.9) 55%, rgba(0,0,0,0) 74%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 37%, rgba(0,0,0,.9) 55%, rgba(0,0,0,0) 74%);
        }
        .w-mid i { background-size: 390px 150px; }
        .slide.active .w-mid i {
            -webkit-animation: waterMid 30s linear infinite;
            animation: waterMid 30s linear infinite;
        }

        /* 近：浪纹最大、最快，压在画面最前 */
        .w-near {
            opacity: 0.16;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 52%, rgba(0,0,0,.9) 70%, #000 90%, rgba(0,0,0,.55) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 52%, rgba(0,0,0,.9) 70%, #000 90%, rgba(0,0,0,.55) 100%);
        }
        .w-near i { background-size: 650px 250px; }
        .slide.active .w-near i {
            -webkit-animation: waterNear 19s linear infinite;
            animation: waterNear 19s linear infinite;
        }

        /* 三层斜率一致(≈21°)，朝左下流动 */
        @-webkit-keyframes waterFar  { from { -webkit-transform: translate3d(0,0,0); } to { -webkit-transform: translate3d(-208px, 80px, 0); } }
        @keyframes        waterFar  { from { transform: translate3d(0,0,0); } to { transform: translate3d(-208px, 80px, 0); } }
        @-webkit-keyframes waterMid  { from { -webkit-transform: translate3d(0,0,0); } to { -webkit-transform: translate3d(-390px, 150px, 0); } }
        @keyframes        waterMid  { from { transform: translate3d(0,0,0); } to { transform: translate3d(-390px, 150px, 0); } }
        @-webkit-keyframes waterNear { from { -webkit-transform: translate3d(0,0,0); } to { -webkit-transform: translate3d(-650px, 250px, 0); } }
        @keyframes        waterNear { from { transform: translate3d(0,0,0); } to { transform: translate3d(-650px, 250px, 0); } }

        /* ====== 老人独立一层（无人物背景 + OldMan-Body.png）======
           OldMan-Body.png 是 Background.png 的 1:1 逐像素抠图，实测对齐在原画
           (220, 199)、缩放 1.0000 —— 换成 Noobject-Ocean 那张无人背景后，
           把他按同样的位置贴回去，尺寸/位置完全对得上，于是他可以单独动。
           坐标都用舞台百分比：left 220/2304=9.5486%、top 199/1728=11.5162%、
           width 1663/2304=72.1788%、height 1529/1728=88.4838%。
           闭眼贴片挂在这一层里面，于是眨眼会跟着人一起晃。 */
        .cover-man-wrap {
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
        .cover-man { display: none; }
        /* 退场时老人单独往左让位的那一层（和上面的晃动分开，互不打架） */
        .cover-man-inner {
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            -webkit-transition: -webkit-transform 1.1s cubic-bezier(0.55, 0.05, 0.28, 1);
            transition: transform 1.1s cubic-bezier(0.55, 0.05, 0.28, 1);
        }
        .cover-man-wrap img.cover-man {
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
        /* 有了无人背景：这一层缩到人身上，并给他一点“慢半拍”的晃动 */
        body.has-ocean .cover-man-wrap {
            left: 9.5486%;
            top: 11.5162%;
            width: 72.1788%;
            height: 88.4838%;
            transform-origin: 56% 97%;      /* 以脚下为轴：上身晃，脚底贴着船舷不动 */
        }
        body.has-ocean .cover-man { display: block; }
        body.has-ocean .slide.active .cover-man-wrap {
            -webkit-animation: manSway 10s ease-in-out infinite alternate;
            animation: manSway 10s ease-in-out infinite alternate;
            -webkit-animation-delay: -0.7s;   /* 负延迟 = 相位落后船的横摇 0.7s */
            animation-delay: -0.7s;
        }
        @-webkit-keyframes manSway {
            from { -webkit-transform: rotate(-0.55deg) translateY(0.3%); }
            to   { -webkit-transform: rotate(0.55deg) translateY(-0.3%); }
        }
        @keyframes manSway {
            from { transform: rotate(-0.55deg) translateY(0.3%); }
            to   { transform: rotate(0.55deg) translateY(-0.3%); }
        }
        /* 闭眼贴片：没有无人背景时按舞台比例摆（人已经画在背景里）；
           有无人背景时按“人”那一层的比例摆（52.375% / 26.00% / 10.598%
           就是把原来的 47.3557% / 34.5251% / 7.6492% 换算进人那一层） */
        body.has-ocean .cover-eyes {
            left: 52.375%;
            top: 26.00%;
            width: 10.598%;
        }

        /* 闭眼贴片：按实测眼位对位（旋转 2.456°，与画面 1:1） */
        .cover-eyes {
            left: 47.3557%;
            top: 34.5251%;
            width: 7.6492%;
            height: auto;
            transform-origin: 0 0;
            transform: rotate(2.456deg);
            opacity: 0;
        }
        /* 一直眨，直到翻页；翻走再回来会自动重播 */
        .slide.active .cover-eyes {
            -webkit-animation: blink 6s linear infinite;
            animation: blink 6s linear infinite;
        }
        /* 6s 一轮：睁眼 5s → 瞬间闭眼 → 闭 1s → 瞬间睁开。
           眨眼是「一闭一开」的硬切，不该有淡入淡出，
           所以两个关键帧贴着写（83.33% → 83.34%），过渡只有 6ms，肉眼看就是瞬间。
           想调闭眼时长，改 83.33% 这个点：闭眼占比 = 100% - 该值。 */
        @-webkit-keyframes blink {
            0%,     83.33% { opacity: 0; }
            83.34%, 100%   { opacity: 1; }
        }
        @keyframes blink {
            0%,     83.33% { opacity: 0; }
            83.34%, 100%   { opacity: 1; }
        }

        /* ====== 入场：像镜头对焦一样推上来 ======
           画面从「略微推近 + 虚焦 + 透明」收成「原尺寸 + 实焦 + 不透明」，
           用 scale 从中心放大、blur 从大到 0、opacity 淡入，3.2s 到位；
           文字在 2.6s 之后才逐词升起，全程约 5s。
           .intro-run 由 JS 在「原画就绪 + 停在第 1 页」时加上，动画结束就摘掉 ——
           否则 blur(0) 会一直挂着一个全屏滤镜层，老机器上白掉帧。 */
        .cover-intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .cover-intro.intro-run {
            -webkit-animation: coverFocus 3.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation: coverFocus 3.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @-webkit-keyframes coverFocus {
            0%   { opacity: 0;   -webkit-transform: scale(1.15); -webkit-filter: blur(1.6vw); }
            18%  { opacity: 0.9; }
            55%  { -webkit-transform: scale(1.04); -webkit-filter: blur(0.6vw); }
            100% { opacity: 1;   -webkit-transform: scale(1);    -webkit-filter: blur(0); }
        }
        @keyframes coverFocus {
            0%   { opacity: 0;   transform: scale(1.15); filter: blur(1.6vw); }
            18%  { opacity: 0.9; }
            55%  { transform: scale(1.04); filter: blur(0.6vw); }
            100% { opacity: 1;   transform: scale(1);    filter: blur(0); }
        }

        /* ====== 封面标题：照 docs/TOMATS.pptx 第 1 页的排版 ======
           PPT 版面 12192000x6858000(16:9)，文字坐标直接按 16:9 版面取：
             · The Old Man and the Sea  36pt 左 5.41% 顶 31.3%
             · 老人与海                  60pt
             · 作者行                    16pt 顶 57.18%（标题块到作者行 24.5pt）
           PPT 在 1280 宽下是 96dpi，故 1pt = 1.3333px = 0.10417vw：
             36pt=3.75vw  60pt=6.25vw  16pt=1.67vw  24.5pt=2.55vw
           颜色 bg1 lumMod 95% → #f2f2f2。
           ⚠ 标题是 .cover 的直接子元素，不在 .rock/.heave 里 —— 文字不跟着船摇，
             只有升起动画；摇晃的是它背后的画。
           （注意：HTML 里用 div 而不是 p，避免命中文件顶部那条
             p{font-size:4vw;color:#aaa;text-align:center} 的全局规则。） */
        .cover-title {
            position: absolute;
            left: 5.41%;
            top: 31.3%;
            width: 62%;
            color: #f2f2f2;
            text-align: left;
            pointer-events: none;
        }
        .cover-title div { text-align: left; color: #f2f2f2; }
        .cover-title .ct-en {
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, "Microsoft YaHei", sans-serif;
            font-size: 3.75vw;
            line-height: 1.2;
            letter-spacing: 0.005em;
            white-space: nowrap;
        }
        .cover-title .ct-zh {
            font-family: "MiSans Heavy", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-weight: 800;
            font-size: 6.25vw;
            line-height: 1.2;
            letter-spacing: 0.012em;
            white-space: nowrap;
        }
        .cover-title .ct-au {
            margin-top: 2.55vw;          /* = PPT 里标题块到作者行的 24.5pt */
            font-family: "Arial Rounded MT Bold", "Arial Rounded MT", Arial, "Microsoft YaHei", sans-serif;
            font-size: 1.67vw;
            line-height: 1.35;
            color: #ececec;
            white-space: nowrap;
        }
        .cover-title .ct-au2 {
            font-family: "MiSans Demibold", "MiSans", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 1.67vw;
            line-height: 1.45;
            color: #ececec;
            white-space: nowrap;
        }
        .cover-title .brk { font-size: 0.875em; }   /* PPT 里的 [ ] 是 14pt，字是 16pt */

        /* 逐词遮罩升起：.wd 是那层 overflow:hidden，里面的 i 从下方 110% 升到 0。
           注意 i 的基础状态是“已就位”——没动画时文字是正常显示的；
           隐藏只由关键帧的 from + animation-fill-mode:both 负责，
           这样翻走时标题不会在整页淡出的过程中提前消失。 */
        .wd {
            display: inline-block;
            overflow: hidden;
            vertical-align: bottom;
            padding-bottom: 0.1em;
            margin-bottom: -0.1em;   /* 补回 padding，不撑行高 */
        }
        .wd > i {
            display: inline-block;
            font-style: normal;
        }
        .cover-ready .slide.active .wd > i {
            -webkit-animation: wordRise 0.95s cubic-bezier(0.25, 1, 0.5, 1) both;
            animation: wordRise 0.95s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        @-webkit-keyframes wordRise {
            from { -webkit-transform: translateY(110%); }
            to   { -webkit-transform: translateY(0); }
        }
        @keyframes wordRise {
            from { transform: translateY(110%); }
            to   { transform: translateY(0); }
        }

        /* ====== 首页 -> 下一页：推进到浪里 ======
           .cover-zoom 一加上，整幅画朝浪的方向放大，老人往左边让位，
           标题先淡出；推到位后由 .slide 的 0.4s 透明度过渡完成换页。
           transform-origin 与 ZOOM_ORIGIN / ZOOM_SCALE 保持一致。 */
        .cover-intro {
            -webkit-transition: -webkit-transform 1.1s cubic-bezier(0.55, 0.05, 0.28, 1), -webkit-filter 1.1s ease;
            transition: transform 1.1s cubic-bezier(0.55, 0.05, 0.28, 1), filter 1.1s ease;
        }
        .cover-zoom .cover-intro {
            -webkit-transform: scale(2.35);
            transform: scale(2.35);
            -webkit-transform-origin: 78% 28%;
            transform-origin: 78% 28%;
        }
        .cover-zoom .cover-man-inner {
            -webkit-transform: translateX(-30%);
            transform: translateX(-30%);
        }
        .cover-title {
            -webkit-transition: opacity 0.45s ease;
            transition: opacity 0.45s ease;
        }
        .cover-zoom .cover-title { opacity: 0; }

        /* 封面与尾页：不留触控提示 */
        body.is-clean #zone-top { background: none; }
    </style>
</head>
<body>

    <!-- 加载页 -->
    <div id="loader">
        <div class="loader-mark">

    <script>
        // 使用原生 ES5 语法，确保老旧一体机浏览器兼容

            var FADE_OUT_MS = 700;       // 离开这一页时，缓出 0.7s

            /* 首页背景图：优先用「去掉老人、保留船」的那张，

            var COVER_ART_TRY = [
                'assets/Noobject-Ocean.png',

            var preImgs = { art: null, man: null, eyes: null, norm: null, occ: null };  // 预加载好的图

            /* 加载页状态（必须在 initLoader() 之前赋初值，否则会被后面的 var 重置） */
            var loaderEl = null, loaderBarEl = null, loaderPctEl = null;

            var container = document.getElementById('slide-container');

            /* ============================================================
               第二页：目录（水底）
               ------------------------------------------------------------
               环境：深水渐变 + 模糊海水底 + 焦散光斑 + 光柱 + 悬浮颗粒 + 暗角；
               条目：一 / 二 / 三 + 中文标题 + 英文小注，细分割线从左侧长出来，
                     文字用和封面同一套遮罩升起（.wd + wordRise），逐条错开 0.18s。
               ============================================================ */
            var TOC_ITEMS = [
                { idx: '一', name: '写作背景', en: 'Writing Background' },
                { idx: '二', name: '课文梗概', en: 'Plot Summary' },

            ];

            /* 光柱：位置、宽窄、延迟都写死，重播时完全一致 */
            function buildSeaRays() {
                var rays = [
                    { l: 8,  w: 5.5, o: 0.55, d: 0 },
                    { l: 24, w: 3.4, o: 0.40, d: -3.2 },
                    { l: 41, w: 6.2, o: 0.50, d: -1.4 },
                    { l: 62, w: 3.8, o: 0.36, d: -5.1 },
                    { l: 78, w: 5.0, o: 0.46, d: -2.3 }
                ], out = '', i, r;
                for (i = 0; i < rays.length; i++) {
                    r = rays[i];
                    out += '<i style="left:' + r.l + '%;width:' + r.w + 'vw;opacity:' + r.o +
                           ';-webkit-animation-delay:' + r.d + 's;animation-delay:' + r.d + 's"></i>';
                }
                return out;
            }

            /* 悬浮颗粒：确定式分布（不用随机数），重播时一样 */
            function buildSeaMotes(n) {
                var out = '', i, l, size, dur, delay;
                for (i = 0; i < n; i++) {
                    l = (i * 37 + 7) % 100;
                    size = 2 + (i % 3);
                    dur = 15 + (i % 6) * 3;
                    delay = -((i * 2.3) % 18);
                    out += '<i style="left:' + l + '%;width:' + size + 'px;height:' + size + 'px;' +
                           '-webkit-animation-duration:' + dur + 's;animation-duration:' + dur + 's;' +
                           '-webkit-animation-delay:' + delay.toFixed(1) + 's;animation-delay:' + delay.toFixed(1) + 's"></i>';
                }
                return out;
            }

            /* 海景底板：第 2 页起的章节页都复用它（深水 + 海底 + 焦散 + 光柱 + 颗粒 + 暗角） */
            function seaLayersHtml() {
                return '<div class="sea-deep"></div>' +
                       '<div class="sea-photo"></div>' +
                       '<div class="sea-caustics"></div>' +
                       '<div class="sea-rays">' + buildSeaRays() + '</div>' +
                       '<div class="sea-motes">' + buildSeaMotes(16) + '</div>' +
                       '<div class="sea-vignette"></div>';
            }

            function buildSeaScene(inner, extraClass) {
                return '<div class="sea-scene' + (extraClass ? ' ' + extraClass : '') + '">' +
                           seaLayersHtml() +
                           inner +
                       '</div>';
            }

            function buildContentsScene() {
                var rows = '', css = '', i, it, t0, lineDelay;
                for (i = 0; i < TOC_ITEMS.length; i++) {
                    it = TOC_ITEMS[i];
                    t0 = 0.45 + i * 0.18;
                    lineDelay = 0.30 + i * 0.18;
                    css += '.toc-row:nth-child(' + (i + 1) + ')::before{-webkit-animation-delay:' +
                           lineDelay.toFixed(2) + 's;animation-delay:' + lineDelay.toFixed(2) + 's}';
                    rows += '<li class="toc-row">' +
                                '<span class="toc-idx">' + riseChars(it.idx, t0, 0.05) + '</span>' +
                                '<span class="toc-name">' + riseChars(it.name, t0 + 0.06, 0.05) + '</span>' +
                                '<span class="toc-en">' + riseChars(it.en, t0 + 0.3, 0.016) + '</span>' +
                            '</li>';
                }
                /* 最后一条下面的收尾线，跟着最后一行一起长出来 */
                css += '.toc-end::before{-webkit-animation-delay:' + (0.30 + TOC_ITEMS.length * 0.18).toFixed(2) +
                       's;animation-delay:' + (0.30 + TOC_ITEMS.length * 0.18).toFixed(2) + 's}';

                return '<div class="sea-scene">' +
                           '<div class="sea-deep"></div>' +
                           '<div class="sea-photo"></div>' +
                           '<div class="sea-caustics"></div>' +
                           '<div class="sea-rays">' + buildSeaRays() + '</div>' +
                           '<div class="sea-motes">' + buildSeaMotes(16) + '</div>' +
                           '<div class="sea-vignette"></div>' +
                           '<div class="toc">' +
                               '<div class="toc-label">' + riseChars('Contents · 目录', 0.18, 0.02) + '</div>' +
                               '<ul class="toc-list">' + rows + '</ul>' +
                               '<div class="toc-end"></div>' +
                           '</div>' +
                           '<style>' + css + '</style>' +
                       '</div>';

            /* ============================================================
               第 3 页起：章节正文页（沿用海景底板）
               ------------------------------------------------------------
               结构：小标签 → 大标题（逐字升起）→ 细分割线 → 副标题 → 正文
                     正文按句拆三行，逐行淡入上浮，讲课时跟着节奏念正好。
               要加新页：往 SECTIONS 里加一个 key（页码）。正文写成字符串数组。
               ============================================================ */
            /* 单屏能放下的短页用它（第 3 页已并入滚动长页，这里暂时留空） */
            var SECTIONS = {};

            /* ============================================================
               第 4 页起：纵向滚动的长页
               ------------------------------------------------------------
               内容比一屏长时用它：每个 stops 项占满一屏，点「下一页」平滑滚到
               下一段的位置（最后一段再点就翻到下一页），「上一页」往回滚。
               文字逐字升起，滚到哪段播哪段。段落里可以有 <strong> 之类的标签。
               ============================================================ */
            var SCROLL_SECTIONS = {
                3: {
                    label: 'Part One · 一 · 写作背景',
                    title: '本书写作的社会背景',
                    /* stops 里可以给每屏一个 sub；不写就沿用上一屏的。
                       蓝色小标题会随滚动切换到当前这一屏的 sub。 */
                    stops: [
                        {
                            sub: '冷战与麦卡锡主义：外部世界的“窒息感”',
                            text: '1950年代初，海明威动笔时，美国正深陷冷战对峙与麦卡锡主义的恐怖氛围。从1950年开始，参议员麦卡锡宣称要清查政府中的共产主义活动，社会空气骤然收紧。海明威战后对“美国之梦”已感破灭，个人自由随时受到威胁的感受，与这种政治高压直接相关。'
                        },
                        {
                            sub: '“迷惘的一代”之后：繁荣表象下的精神废墟',
                            text: '一战之后，海明威和他同代的年轻人因战争创伤而陷入精神上的“迷惘”——他们失去了人生理想与奋斗目标，在痛苦中找不到出路。到了1950年代，美国经济在战后空前繁荣，消费主义席卷社会，但物质的丰裕并未填补精神的空洞。'
                        },
                        {
                            text: '海明威此时本人也正处于人生的低谷：上一部小说《过河入林》被评论界宣判“文才枯竭”。他面对的是一个双重困境——<strong>外部是政治高压，内部是个人创造力与精神信念的危机</strong>。圣地亚哥在绝境中喊出的“一个人可以被毁灭，但不能被打败”，正是在这片精神废墟上立起的一块碑。'
                        },
                        /* 4) 存在主义与虚无主义 */
                        {
                            sub: '存在主义与虚无主义：战后思潮的底色',
                            text: '战后欧洲弥漫着一种更为根本的哲学情绪：<strong>虚无主义</strong>。世界似乎不再提供终极意义，人在其中承受着无理由的打击。有论者指出，这种思潮在海明威身处的战后时代开始盛行，而海明威最终的自杀，也与他“无法从虚无主义的泥潭中拔足”有关。'
                        },
                        {
                            text: '但《老人与海》的独特之处在于，它没有停留在虚无之中。它被解读为一部<strong>积极的存在主义小说</strong>：在一个“文明极端暴力和道德混乱的年代”里，圣地亚哥的形象提供了一种面对荒诞的方式——<strong>不指望世界给出回报，但仍然选择行动、选择搏斗、选择在失败中确认自身的尊严</strong>。老人最终只带回一副骨架，这个结局本身就是对“努力必有回报”这一世俗逻辑的拒绝；而他的“不败”，恰恰建立在接受这种“无回报”的前提之上。'
                        },
                        /* 5) 古巴：具体的历史地理褶皱 */
                        {
                            sub: '古巴：具体的历史地理褶皱',
                            text: '故事的具体空间是古巴，而1951年的古巴社会本身也处于复杂的张力之中。海明威自1940年代起定居古巴，那里是他的“第二故乡”，但当时古巴社会对美国抱有复杂的敌意与批判情绪，同时西班牙移民的处境也并不轻松。古巴当时还处于巴蒂斯塔独裁统治之下，社会矛盾暗流涌动。'
                        },

                        },
                        /* 6) 收束：背景如何塑造了“不败”的定义 */
                        {
                            sub: '背景如何塑造了“不败”的定义',
                            text: '把这些线索放在一起看，《老人与海》的社会背景揭示了一个关键事实：<strong>1950年代初的世界，正在系统性地告诉一个人——“你的努力没有终极意义”</strong>。冷战的高压、消费主义的空洞、虚无主义的诱惑，从外部和内部同时瓦解着人的尊严感。'
                        },
